# Exercise the current vendor binaries against a loopback-only Router mock.
# No vendor credential or paid inference is involved: the mock serves the live
# catalog contract, captures one native request, and returns synthetic output.
name: Real Client Capture

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-client-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  real-client-capture:
    name: Claude Code, Codex, and OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install pinned real clients
        run: |
          npm install --global \
            @anthropic-ai/claude-code@2.1.261 \
            @openai/codex@0.153.4 \
            opencode-ai@1.18.29
          claude --version | grep -F '2.1.261'
          codex --version | grep -F '0.153.4'
          opencode --version | grep -Fx '1.18.29'

      - name: Capture native requests against the offline mock
        env:
          ROUTER_REAL_CLIENT_TESTS: '1'
        run: cargo test --locked --test real_clients_test -- --nocapture --test-threads=1

      - name: Probe real providers when protected credentials are configured
        env:
          ROUTER_LIVE_CLAUDE_CREDENTIAL_JSON: ${{ secrets.ROUTER_LIVE_CLAUDE_CREDENTIAL_JSON }}
          ROUTER_LIVE_CODEX_CREDENTIAL_JSON: ${{ secrets.ROUTER_LIVE_CODEX_CREDENTIAL_JSON }}
          ROUTER_LIVE_ZAI_API_KEY: ${{ secrets.ROUTER_LIVE_ZAI_API_KEY }}
          LEFINE_API_KEY: ${{ secrets.LEFINE_API_KEY }}
        run: |
          cargo test --locked --test subscription_usage_live_test -- --test-threads=1
          cargo test --locked --test lefine_live_test -- --test-threads=1
