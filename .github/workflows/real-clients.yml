# The real-client tier: run the actual vendor CLIs against a live router.
#
# `tests/real_clients_test.rs` is opt-in behind ROUTER_REAL_CLIENT_TESTS=1 and
# was referenced by no workflow, so it never ran (issue #211). It cannot run on
# pull requests — it needs vendor subscriptions and takes minutes — but "never"
# is not the right cadence either. This runs it nightly, where credentials can
# live, and leaves the fast fixture tier (tests/client_fixture_test.rs) to cover
# every pull request offline.
name: Real Clients

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  push:
    branches: [fix/issue-285-ci-final2]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  real-clients:
    name: Real Client Single Turn
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      # The tier needs a running router and a task token. Without them there is
      # nothing to test against, and a run that quietly asserts nothing is the
      # problem this workflow exists to fix — so say so and stop.
      - name: Check for a configured router
        id: configured
        env:
          ROUTER_REAL_SERVER: ${{ secrets.ROUTER_REAL_SERVER }}
        run: |
          if [ -z "$ROUTER_REAL_SERVER" ]; then
            echo "::notice::ROUTER_REAL_SERVER is not configured; the real-client tier cannot run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the real-client tier
        if: steps.configured.outputs.run == 'true'
        env:
          ROUTER_REAL_CLIENT_TESTS: '1'
          ROUTER_REAL_SERVER: ${{ secrets.ROUTER_REAL_SERVER }}
          ROUTER_REAL_TOKEN: ${{ secrets.ROUTER_REAL_TOKEN }}
        run: cargo test --locked --test real_clients_test -- --nocapture

  repair-issue-285:
    name: Repair Issue 285
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/issue-285-ci-final2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply production fix and regression test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          prod = Path("src/subscription.rs")
          text = prod.read_text()
          old = '''    fn import_source_keychain(&self) -> Option<String> {
        crate::platform_keychain::lookup(self.provider)
    }'''
          new = '''    fn import_source_keychain(&self) -> Option<String> {
        if !self.is_vendor_default_home() {
            return None;
        }
        crate::platform_keychain::lookup(self.provider)
    }'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old_must_use = '''    #[must_use]
    pub fn install_document(&self, document: &str) -> Result<PathBuf, String> {'''
          new_must_use = '''    #[must_use = "use the installed credential path or handle the installation error"]
    pub fn install_document(&self, document: &str) -> Result<PathBuf, String> {'''
          assert text.count(old_must_use) == 1
          prod.write_text(text.replace(old_must_use, new_must_use, 1))

          tests = Path("src/subscription_tests.rs")
          text = tests.read_text()
          marker = '''#[test]
fn a_pooled_home_never_consults_the_machine_store() {'''
          regression = '''#[test]
fn explicit_import_home_never_consults_the_machine_store() {
    let dir = tempfile::tempdir().unwrap();
    let reader = SubscriptionReader::new(SubscriptionProvider::Claude, dir.path());

    assert!(!reader.is_vendor_default_home());
    assert!(reader.read_token_from_keychain().is_none());
}

'''
          assert text.count(marker) == 1
          tests.write_text(text.replace(marker, regression + marker, 1))
          PY
          cat > changelog.d/20260825_072000_auth-import-explicit-source.md <<'EOF'
          ---
          bump: patch
          ---

          ### Fixed
          - Explicit `auth import <provider> <dir>` sources now stay authoritative when the named directory is not the vendor's default home, even when the machine-wide platform credential is newer.
          EOF
      - name: Verify the repair with CI-equivalent commands
        run: |
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
      - name: Restore workflow and publish clean fix commit
        shell: bash
        run: |
          git checkout main -- .github/workflows/real-clients.yml
          git add src/subscription.rs src/subscription_tests.rs changelog.d/20260825_072000_auth-import-explicit-source.md .github/workflows/real-clients.yml
          git commit -m "fix: honor explicit auth import source directories"
          git push origin HEAD:fix/issue-285-ci-final2
