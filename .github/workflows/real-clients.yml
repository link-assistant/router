# Exercise the current vendor binaries against a loopback-only Router mock.
# No vendor credential or paid inference is involved: the mock serves the live
# catalog contract, captures one native request, and returns synthetic output.
name: Real Client Capture

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-client-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  real-client-capture:
    name: Claude Code, Codex, Gemini, Qwen, and OpenCode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install Router verification runner
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install pinned real clients
        run: |
          npm install --global \
            @anthropic-ai/claude-code@2.1.265 \
            @openai/codex@0.154.0 \
            @google/gemini-cli@0.59.0 \
            @qwen-code/qwen-code@0.23.1 \
            opencode-ai@1.18.29

      - name: Capture native requests against the offline mock
        env:
          ROUTER_REAL_CLIENT_TESTS: '1'
          ROUTER_REAL_CLIENT_CLAUDE_VERSION: '2.1.265'
          ROUTER_REAL_CLIENT_CODEX_VERSION: '0.154.0'
          ROUTER_REAL_CLIENT_OPENCODE_VERSION: '1.18.29'
        run: rust-script scripts/verify-contracts.rs --area real-clients

      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: target/verification/
          if-no-files-found: ignore

      # The credentialed tier is NOT run here. This workflow triggers on
      # `pull_request`, where a fork has no secrets, so a live tier attached to
      # it either fails for want of a credential on somebody else's unrelated
      # change, or silently proves nothing while looking green (issue #567).
      # It lives in `live-tier.yml`, on manual dispatch, where an operator asks
      # for it and reads the result. This job stays what its name says: real
      # clients, no credentials, nothing spent.

  # The pinned 2.1.265 capture above is a tested baseline, not a maximum:
  # Router does not refuse a newer Claude by version number (issue #609). Run
  # the same hermetic Claude capture -- native model discovery, Router-only
  # sampling credentials, the untouched stored Claude.ai login, and the model
  # selector -- against newer releases so client drift fails here, at the
  # operation that changed, rather than being hidden behind a version gate.
  claude-newer-release:
    name: Claude Code ${{ matrix.claude }} (capture ${{ matrix.capture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `latest` moves under every pull request; keep pull requests on a
        # pinned newer release and let push, nightly, and manual runs also
        # track the moving tag.
        claude: ${{ fromJSON(github.event_name == 'pull_request' && '["2.1.284", "2.1.291"]' || '["2.1.284", "2.1.291", "latest"]') }}
        capture: [1]
        include:
          # The affected release previously passed once and failed its repeat.
          - claude: '2.1.291'
            capture: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install Router verification runner
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Claude Code ${{ matrix.claude }}
        env:
          CLAUDE_TAG: ${{ matrix.claude }}
        run: |
          version="$(npm view "@anthropic-ai/claude-code@${CLAUDE_TAG}" version)"
          npm install --global "@anthropic-ai/claude-code@${version}"
          echo "ROUTER_REAL_CLIENT_CLAUDE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Capture native Claude requests against the offline mock
        env:
          ROUTER_REAL_CLIENT_TESTS: '1'
        run: rust-script scripts/verify-contracts.rs --area real-clients --client claude

      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: target/verification/
          if-no-files-found: ignore

  # Codex 0.157 made TUI startup depend on workspace discovery through
  # `wham/accounts/check` (issue #612), which the pinned 0.154.0 capture never
  # calls. Run the Codex capture, history/notes, and TUI model selector against
  # a newer release so bootstrap drift fails at the operation that changed.
  codex-newer-release:
    name: Codex ${{ matrix.codex }} (newer than baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Same policy as Claude: pull requests pin a newer release; push,
        # nightly, and manual runs also track the moving tag.
        codex: ${{ fromJSON(github.event_name == 'pull_request' && '["0.158.0"]' || '["0.158.0", "latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install Router verification runner
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Codex ${{ matrix.codex }}
        env:
          CODEX_TAG: ${{ matrix.codex }}
        run: |
          version="$(npm view "@openai/codex@${CODEX_TAG}" version)"
          npm install --global "@openai/codex@${version}"
          echo "ROUTER_REAL_CLIENT_CODEX_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Capture native Codex requests against the offline mock
        env:
          ROUTER_REAL_CLIENT_TESTS: '1'
        run: rust-script scripts/verify-contracts.rs --area real-clients --client codex

      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: target/verification/
          if-no-files-found: ignore
