# Temporary policy: docs/development/manual-translation-development.md
name: JavaScript Development (temporary manual translation)
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit for temporary manual development checks
        required: true
        type: string
    outputs:
      rust_allowed:
        description: True only after every active manual development stage passed for this SHA; never strict parity
        value: ${{ jobs.complete.outputs.rust_allowed }}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |-
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - run: npm ci --prefix scripts/ci --ignore-scripts
      - run: npm ci --prefix js --ignore-scripts
      - run: node scripts/sync-rust-assets.mjs --check
      - run: node scripts/lint-js-first.mjs
      - if: ${{ inputs.sha == github.sha || hashFiles('scripts/test/manual-development.test.mjs') != '' }}
        run: node --test scripts/test/manual-development.test.mjs
      - if: ${{ inputs.sha == github.sha || hashFiles('scripts/check-manual-development-workflows.mjs') != '' }}
        run: node scripts/check-manual-development-workflows.mjs
      - if: ${{ inputs.sha == github.sha || hashFiles('tools/translation/test/matrix-trace-writer.test.mjs') != '' }}
        run: node --test tools/translation/test/matrix-trace-writer.test.mjs
      - if: ${{ inputs.sha == github.sha || hashFiles('tools/translation/test/matrix-trace-writer.test.mjs') != '' }}
        run: bun test tools/translation/test/matrix-trace-writer.test.mjs
  node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |-
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - run: npm ci --prefix js --ignore-scripts
      - run: npm run native:test --prefix js
  bun-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |-
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - run: npm ci --prefix js --ignore-scripts
      - run: npm run native:test:bun --prefix js
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |-
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - run: npm ci --prefix js --ignore-scripts
      - run: npm ci --prefix ui --ignore-scripts
      - run: node scripts/run-node-tests.mjs --outer-timeout-ms=180000 scripts/test/node-case-deadlines.test.mjs
      - run: npm run typecheck --prefix js
      - run: npm run native:typecheck --prefix js
      - run: node scripts/check-native-typescript.mjs
      - run: node js/node_modules/typescript/bin/tsc -p tools/translation/tsconfig.json
      - run: node scripts/build-js-first-ui.mjs
      - name: Preserve complete Node deadline audit and raw streams
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-case-deadlines-${{ github.job }}-${{ inputs.sha }}
          path: js/node_modules/.node-case-deadlines/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  complete:
    name: JavaScript fully green
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - lint
      - node-tests
      - bun-tests
      - typescript
    if: ${{ always() }}
    outputs:
      rust_allowed: ${{ steps.admit.outputs.rust_allowed }}
    steps:
      - name: Require every active development stage; report suspended checks
        id: admit
        env:
          STAGE_RESULTS: ${{ toJSON(needs) }}
        run: |-
          node --input-type=module -e "
            import fs from 'node:fs';
            const stages = JSON.parse(process.env.STAGE_RESULTS);
            const required = ['lint', 'node-tests', 'bun-tests', 'typescript'];
            if (Object.keys(stages).length !== required.length || required.some(id => stages[id]?.result !== 'success')) {
              console.error('Manual development checks rejected:', process.env.STAGE_RESULTS);
              process.exit(1);
            }
            if (process.env.GITHUB_OUTPUT) fs.appendFileSync(process.env.GITHUB_OUTPUT, 'rust_allowed=true\n');
            console.log('Temporary manual development checks passed. Automated translation checks are suspended; strict parity is unverified. Same-SHA Rust CI may now run; its failures remain fatal.');
          "
