name: Verify GitHub Releases

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  verify-github-releases:
    name: Every Tag Has a GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Verify GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-github-releases.rs --repository "${{ github.repository }}" --default-branch main

  # Independent re-check of the newest release: resolve the annotated tag here and
  # compare it with what the registries and the release assets actually claim.
  verify-release-provenance:
    name: Latest Release Matches Its Tag Commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # By highest version, not by whichever release was published most
      # recently. A release page created late for an older version carries the
      # newest publication timestamp, so `gh release view` with no tag answered
      # for that one — and it legitimately has no assets, because the artifact
      # jobs ran for the version being released at the time. Asking for the
      # newest *version* is what this job's name has always meant.
      - name: Resolve the latest published release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(gh release list --repo "${{ github.repository }}" --limit 1000 \
            --json tagName --jq '.[].tagName' \
            | sed 's/^v//' | sort -V | tail -1)"
          if [ -z "$version" ]; then
            echo "::error::no published releases found"
            exit 1
          fi
          echo "resolved v$version" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          mkdir -p published
          gh release download "v${RELEASE_VERSION}" --repo "${{ github.repository }}" --dir published --clobber

      - name: Verify checksums exactly as a consumer does
        shell: bash
        run: |
          cd published
          shopt -s nullglob
          checksums=(*.sha256)
          if [ "${#checksums[@]}" -eq 0 ]; then
            echo "::error::the latest release published no checksum files"
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            sha256sum -c "$checksum"
          done

      - name: Verify the latest release matches its tag commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          rust-script scripts/check-release-provenance.rs \
            --release-version "${RELEASE_VERSION}" \
            --repository "${{ github.repository }}" \
            --image "ghcr.io/${{ github.repository }}:${RELEASE_VERSION}" \
            --asset-dir published
