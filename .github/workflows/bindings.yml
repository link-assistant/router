name: Downstream Operations and Contracts
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: false
jobs:
  javascript:
    if: ${{ github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false' }}
    name: JavaScript first (same commit)
    uses: ./.github/workflows/javascript-manual-development.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read

  bindings:
    if: needs.javascript.outputs.rust_allowed == 'true' && (needs.javascript.result == 'success')
    needs: [javascript]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['20', '24', '26.13.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.node == '26.13.1' && '3.15.2' || '3.10' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.5'
      - run: cargo build --locked --bins
      - run: python scripts/generate-contracts.py --check
      - run: python scripts/generate-bindings.py --check
      - run: python experiments/issue-697/test_contract_compatibility.py
      - run: python experiments/issue-697/test_remote_json_consumers.py
      - run: python experiments/issue-697/test_deploy_status.py
        if: runner.os == 'Linux'
      - name: Compare published contracts with PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check-contract-compatibility.py --base "$BASE_SHA"
      - run: cargo test --locked --test operations_api_test --test contract_inventory_test
      - run: npm ci
        working-directory: js
      - run: npm test && npm run typecheck
        working-directory: js
      - run: bun test test/router.test.js
        working-directory: js
      - run: python -m pip install uv==0.13.10
      - run: uv run --project packages/python --python "$(command -v python)" --locked python -m unittest discover -s packages/python/tests -v
      - name: Audit locked Python dependencies
        if: runner.os == 'Linux' && matrix.node == '26.13.1'
        run: uv run --project packages/python --python "$(command -v python)" --locked python -m pip_audit --skip-editable
      - name: Verify distributions
        run: |
          (cd js && npm pack --dry-run)
          uv run --project packages/python --python "$(command -v python)" --locked python -m build packages/python
  semver:
    needs: [javascript]
    if: needs.javascript.outputs.rust_allowed == 'true' && (needs.javascript.result == 'success' && (github.event_name == 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - run: cargo install cargo-semver-checks --version 0.51.0 --locked
      - name: Check documented minor API changes against PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # --baseline-rev extracts the base tree through temporary names 43 bytes
        # longer than each file name, which exceeds the 255-byte limit for the
        # longest translation fixtures. tar extracts the same tree under the
        # final names, and --baseline-root reads it as --baseline-rev would.
        run: |
          baseline="target/semver-checks/baseline-$BASE_SHA"
          mkdir -p "$baseline"
          git archive "$BASE_SHA" | tar -x -C "$baseline"
          cargo semver-checks check-release --baseline-root "$baseline" --release-type minor
  generated-http:
    if: needs.javascript.outputs.rust_allowed == 'true' && (needs.javascript.result == 'success')
    needs: [javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          check-latest: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.6'
          tools: composer:2.11.3
          coverage: none
      - name: Install pinned Maven for the generated Java client
        run: |
          version=3.10.2
          artifact="apache-maven-$version-bin.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --proto '=https' "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$version/$artifact"
          printf '%s  %s\n' 57d2db6b37e7582119137ade544557bba741b29e62109ef81539a2bdfd6d0e641fdd5d8edb014af1816d0510deac6fac8f347433b3a1aa36316ba85aa77b8119 "$artifact" | sha512sum --check --strict
          tar -xzf "$artifact"
          printf '%s/apache-maven-%s/bin\n' "$RUNNER_TEMP" "$version" >> "$GITHUB_PATH"
      - run: cargo build --locked --bins
      - run: python -m pip install uv==0.13.10
      - run: bash scripts/generate-http-clients.sh
      - name: Configure the Maven Central mirror for the generated Java client
        run: |
          settings="$RUNNER_TEMP/router-maven-settings.xml"
          cat > "$settings" <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF
          printf 'MAVEN_ARGS=--settings %s\n' "$settings" >> "$GITHUB_ENV"
      - run: uv run --project packages/python --python "$(command -v python)" --locked bash scripts/test-http-clients.sh
