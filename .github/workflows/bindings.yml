name: Downstream Operations and Contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bindings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/javascript/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: cargo build --locked --bins
      - run: python scripts/generate-contracts.py --check
      - run: python scripts/generate-bindings.py --check
      - run: python experiments/issue-697/test_contract_compatibility.py
      - run: python experiments/issue-697/test_remote_json_consumers.py
      - run: python experiments/issue-697/test_deploy_status.py
        if: runner.os == 'Linux'
      - name: Compare published contracts with PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check-contract-compatibility.py --base "$BASE_SHA"
      - run: cargo test --locked --test operations_api_test --test contract_inventory_test
      - run: npm ci
        working-directory: packages/javascript
      - run: npm test && npm run typecheck
        working-directory: packages/javascript
      - run: bun test test/router.test.js
        working-directory: packages/javascript
      - run: python -m pip install -e packages/python
      - run: python -m unittest discover -s packages/python/tests -v
      - name: Verify distributions
        run: |
          (cd packages/javascript && npm pack --dry-run)
          python -m pip install build
          python -m build packages/python
  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - run: cargo install cargo-semver-checks --version 0.51.0 --locked
      - name: Check documented minor API changes against PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo semver-checks check-release --baseline-rev "$BASE_SHA" --release-type minor
  generated-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - run: cargo build --locked --bins
      - run: python3 -m pip install -e packages/python
      - run: bash scripts/generate-http-clients.sh
      - run: bash scripts/test-http-clients.sh
