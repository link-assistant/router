# TEMPORARY experiment for issue #803 (removed before the pull request is
# finalized; a copy is kept in experiments/issue-803/). It measures how long the
# exact `publish-release-artifacts` Darwin build takes on the same runner image,
# and samples swap usage so CPU-bound and memory-bound slowness can be told
# apart. It needs no secrets and publishes nothing.
name: Experiment issue 803 Darwin release build timing

on:
  push:
    branches: [issue-803-b93c8d23944d]
    paths: ['.github/workflows/experiment-issue-803-darwin-build.yml']

permissions:
  contents: read

concurrency:
  group: experiment-issue-803-${{ github.ref }}
  cancel-in-progress: false

jobs:
  javascript:
    name: JavaScript first (same commit)
    uses: ./.github/workflows/javascript-manual-development.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read

  darwin-release-build:
    if: needs.javascript.outputs.rust_allowed == 'true' && (needs.javascript.result == 'success')
    needs: [javascript]
    name: Time release build (darwin-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: amd64
            target: x86_64-apple-darwin
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Runner hardware
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          sysctl vm.swapusage

      - name: Build release binaries (timed, with swap sampling)
        shell: bash
        run: |
          (while true; do echo "sample $(date -u +%H:%M:%S) $(sysctl -n vm.swapusage) | $(memory_pressure -Q 2>/dev/null | tail -1)"; sleep 60; done) &
          sampler=$!
          start=$(date +%s)
          /usr/bin/time -l cargo build --locked --release --bins --target ${{ matrix.target }} 2> >(tee build-stderr.log >&2)
          end=$(date +%s)
          kill "$sampler" || true
          echo "BUILD_SECONDS=$((end - start))"
          grep -E "maximum resident set size|real" build-stderr.log | tail -3

      - name: Install pinned CycloneDX generator (timed)
        shell: bash
        run: |
          start=$(date +%s)
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          echo "CYCLONEDX_INSTALL_SECONDS=$(( $(date +%s) - start ))"

  macos-lifecycle-test-build:
    if: needs.javascript.outputs.rust_allowed == 'true' && (needs.javascript.result == 'success')
    needs: [javascript]
    name: Time lifecycle test build (macos-26)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Build the host CLI lifecycle test (timed)
        shell: bash
        run: |
          start=$(date +%s)
          cargo test --locked --no-run --test host_client_lifecycle_test
          echo "TEST_BUILD_SECONDS=$(( $(date +%s) - start ))"
