name: Merged Source Delivery
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
# Hourly runs must not overlap: a slow artifact verification would otherwise
# race the next run and report the same delivery twice (issue #648).
concurrency:
  group: merged-source-delivery
  cancel-in-progress: false
jobs:
  javascript:
    name: JavaScript first (same commit)
    uses: ./.github/workflows/javascript-first.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read

  delivery:
    if: needs.javascript.result == 'success'
    needs: [javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - run: cargo install rust-script --version 0.36.0 --locked
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Verify exact merged source and complete delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-delivery.rs --verify-artifacts
      - name: Save delivery state and explicit recovery command
        if: always()
        run: |
          if [ -f target/verification/delivery.json ]; then
            cat target/verification/delivery.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::check-delivery.rs stopped before recording a delivery state; see the step above"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: delivery-state
          path: target/verification/delivery.json
