name: Merged Source Delivery
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
# Hourly runs must not overlap: a slow artifact verification would otherwise
# race the next run and report the same delivery twice (issue #648).
concurrency:
  group: merged-source-delivery
  cancel-in-progress: false
jobs:
  javascript:
    name: JavaScript first (same commit)
    uses: ./.github/workflows/javascript-manual-development.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read

  delivery:
    if: needs.javascript.outputs.rust_allowed == 'true' && (needs.javascript.result == 'success')
    needs: [javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - run: bash scripts/install-ci-cargo-tool.sh rust-script
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify exact merged source and complete delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-delivery.rs --verify-artifacts
      - name: Save delivery state and explicit recovery command
        if: always()
        run: |
          if [ -f target/verification/delivery.json ]; then
            cat target/verification/delivery.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::check-delivery.rs stopped before recording a delivery state; see the step above"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: delivery-state
          path: target/verification/delivery.json
