name: issue-285-fix-v2

on:
  push:
    branches:
      - fix/issue-285-explicit-import-source-v2

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add regression test and verify RED
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("src/subscription_tests.rs")
          text = path.read_text()
          marker = "/// A home with no credential is an error naming the home, not an empty import."
          assert marker in text
          name = "explicit_import_home_does_not_adopt_newer_keychain_credential"
          assert name not in text
          test = r'''

          /// An explicitly named source directory remains authoritative even
          /// when the machine-wide credential store is newer (issue #285).
          #[test]
          fn explicit_import_home_does_not_adopt_newer_keychain_credential() {
              let dir = tempfile::tempdir().unwrap();
              let reader = claude_home_expiring_at(dir.path(), 1_000);
              let store = serde_json::json!({
                  "claudeAiOauth": {
                      "accessToken": "keychain-access",
                      "refreshToken": "keychain-refresh",
                      "expiresAt": 9_999_999_i64,
                  }
              })
              .to_string();

              let source = reader
                  .import_from_store(Some(&store))
                  .expect("a credential is available");

              assert_eq!(source.origin, crate::platform_keychain::Origin::File);
              assert_eq!(source.token.access_token, "file-access");
              assert!(source.document.contains("file-access"));
              assert!(!source.document.contains("keychain-access"));
          }
          '''
          path.write_text(text.replace(marker, test + "\n" + marker, 1))
          PY
          set +e
          cargo test --lib explicit_import_home_does_not_adopt_newer_keychain_credential
          status=$?
          set -e
          test "$status" -ne 0
          git add src/subscription_tests.rs .github/workflows/issue-285-fix-v2.yml
          git commit -m "test: cover explicit auth import source precedence"
          git push origin HEAD:fix/issue-285-explicit-import-source-v2

      - name: Unreachable in the RED run
        if: ${{ failure() }}
        run: exit 1
