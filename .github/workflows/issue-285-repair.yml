name: issue-285-repair

on:
  push:
    branches: [fix/issue-285-final]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply fix, regression test, and changelog
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          prod = Path("src/subscription.rs")
          text = prod.read_text()

          old = '''    fn import_source_keychain(&self) -> Option<String> {
        crate::platform_keychain::lookup(self.provider)
    }'''
          new = '''    fn import_source_keychain(&self) -> Option<String> {
        if !self.is_vendor_default_home() {
            return None;
        }
        crate::platform_keychain::lookup(self.provider)
    }'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old_must_use = '''    #[must_use]
    pub fn install_document(&self, document: &str) -> Result<PathBuf, String> {'''
          new_must_use = '''    #[must_use = "use the installed credential path or handle the installation error"]
    pub fn install_document(&self, document: &str) -> Result<PathBuf, String> {'''
          assert text.count(old_must_use) == 1
          prod.write_text(text.replace(old_must_use, new_must_use, 1))

          tests = Path("src/subscription_tests.rs")
          text = tests.read_text()
          marker = '''#[test]
fn a_pooled_home_never_consults_the_machine_store() {'''
          regression = '''#[test]
fn explicit_import_home_never_consults_the_machine_store() {
    let dir = tempfile::tempdir().unwrap();
    let reader = SubscriptionReader::new(SubscriptionProvider::Claude, dir.path());

    assert!(!reader.is_vendor_default_home());
    assert!(reader.read_token_from_keychain().is_none());
}

'''
          assert text.count(marker) == 1
          tests.write_text(text.replace(marker, regression + marker, 1))
          PY

          cat > changelog.d/20260825_071500_auth-import-explicit-source.md <<'EOF'
          ---
          bump: patch
          ---

          ### Fixed
          - Explicit `auth import <provider> <dir>` sources now stay authoritative when the named directory is not the vendor's default home, even when the machine-wide platform credential is newer.
          EOF

      - name: Verify with CI-equivalent commands
        run: |
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets

      - name: Remove repair workflow and publish clean commit
        shell: bash
        run: |
          rm .github/workflows/issue-285-repair.yml
          git add src/subscription.rs src/subscription_tests.rs changelog.d/20260825_071500_auth-import-explicit-source.md .github/workflows/issue-285-repair.yml
          git commit -m "fix: honor explicit auth import source directories"
          git push origin HEAD:fix/issue-285-final
