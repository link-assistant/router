name: issue-285-apply

on:
  push:
    branches:
      - fix/issue-285-explicit-source-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply exact production fix and regression test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          prod = Path("src/subscription.rs")
          text = prod.read_text()
          old = """    fn import_source_keychain(&self) -> Option<String> {\n        crate::platform_keychain::lookup(self.provider)\n    }"""
          new = """    fn import_source_keychain(&self) -> Option<String> {\n        if !self.is_vendor_default_home() {\n            return None;\n        }\n        crate::platform_keychain::lookup(self.provider)\n    }"""
          if old not in text:
              raise SystemExit("production target not found")
          prod.write_text(text.replace(old, new, 1))

          tests = Path("src/subscription_tests.rs")
          text = tests.read_text()
          marker = "/// A home with no credential is an error naming the home, not an empty import."
          if "explicit_import_home_does_not_adopt_a_newer_keychain_credential" not in text:
              test = r'''

          /// An explicitly named source directory remains authoritative even
          /// when the machine-wide credential store is newer (issue #285).
          #[test]
          fn explicit_import_home_does_not_adopt_a_newer_keychain_credential() {
              let dir = tempfile::tempdir().unwrap();
              let reader = claude_home_expiring_at(dir.path(), 1_000);
              let source = reader
                  .read_document_for_import()
                  .expect("the explicitly named credential should be importable");

              assert_eq!(source.origin, crate::platform_keychain::Origin::File);
              assert_eq!(source.token.access_token, "file-access");
              assert!(source.document.contains("file-access"));
              assert!(!reader.is_vendor_default_home());
              assert!(reader.read_token_from_keychain().is_none());
          }
          '''
              if marker not in text:
                  raise SystemExit("test insertion marker not found")
              tests.write_text(text.replace(marker, test + "\n" + marker, 1))
          PY
          cargo fmt --all
          cargo test --lib explicit_import_home_does_not_adopt_a_newer_keychain_credential
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
          rm .github/workflows/issue-285-apply.yml
          git add src/subscription.rs src/subscription_tests.rs .github/workflows/issue-285-apply.yml
          git commit -m "fix: honor explicit auth import source directories"
          git push origin HEAD:fix/issue-285-explicit-source-clean
