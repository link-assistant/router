name: Docker Runtime Build

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - 'benches/**'
      - 'tests/**'
      - 'examples/**'
      - 'src/**'
      - '**/*.rs'
      - 'ui/dist/**'
      - 'docs/provider-evidence/**'
      - 'scripts/docker-cache-targets.py'
      - 'experiments/issue-689/test_docker_cache.py'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Build amd64 runtime (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust for manifest regression tests
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - name: Test dependency-cache target generation
        run: python3 experiments/issue-689/test_docker_cache.py
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build the complete runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: router:pr-test
          cache-from: type=gha,scope=pr-runtime-amd64
          cache-to: type=gha,mode=max,scope=pr-runtime-amd64
      - name: Check all shipped commands
        run: |
          docker run --rm router:pr-test --version
          docker run --rm --entrypoint router router:pr-test --version
          docker run --rm --entrypoint with-router router:pr-test --help
      - name: Verify long named instances through real Docker DNS and relay
        run: python3 experiments/issue-715/reproduce-dns.py --fixed --image router:pr-test
