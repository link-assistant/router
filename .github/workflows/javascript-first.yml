name: JavaScript First
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit tested before any Rust job
        required: true
        type: string
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - run: npm ci --prefix scripts/ci --ignore-scripts
      - run: node scripts/lint-js-first.mjs
      - run: node --test scripts/test/check-js-first-workflows.test.mjs
      - run: node --test scripts/test/check-js-first-local.test.mjs
      - run: node scripts/check-js-first-workflows.mjs
  node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - run: npm ci --prefix packages/javascript --ignore-scripts
      - run: npm run native:test --prefix packages/javascript
  bun-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - run: npm ci --prefix packages/javascript --ignore-scripts
      - run: npm run native:test:bun --prefix packages/javascript
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - run: npm ci --prefix packages/javascript --ignore-scripts
      - run: npm run typecheck --prefix packages/javascript
      - run: npm run native:typecheck --prefix packages/javascript
      - run: node scripts/regenerate-native-typescript.mjs --check
      - run: node scripts/check-native-typescript.mjs
      - run: node --test tools/translation/js-to-rust/test/native-typescript.test.mjs
      - run: node packages/javascript/node_modules/typescript/bin/tsc -p tools/translation/tsconfig.json
      - run: node tools/translation/check-typescript-fixtures.mjs
      - run: node scripts/check-profile-typescript.mjs
      - run: node tools/translation/serialization-schema/native-descriptor.mjs --check
      - run: node tools/translation/serialization-schema/check-descriptor-typescript.mjs
      - run: node tools/translation/serialization-schema/bulk.mjs --check
      - run: node tools/translation/serialization-schema/check-bulk-typescript.mjs
      - run: npm ci --prefix ui --ignore-scripts
      - run: node scripts/build-js-first-ui.mjs
  parity:
    runs-on: ubuntu-24.04
    # Four complete checkers: three sequential acceptance assertions plus the
    # final strict command. Include every unique 180s evidence runner, 1200s
    # canonical comparison per checker, inventory/fixtures and other acceptance.
    # The structural audit verifies this bound against the current manifest.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - run: npm ci --prefix packages/javascript --ignore-scripts
      - run: node --test --test-concurrency=2 experiments/issue-759/acceptance/*.test.mjs
      - run: node scripts/check-router-parity.mjs --strict
  translation:
    runs-on: ubuntu-24.04
    # Cycle nine forward/canonical steps reached 719s/752s; the separate matrix
    # stage prevents their sum exhausting a shared 60-minute job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - run: node --test --test-concurrency=2 tools/translation/test/*.test.mjs tools/translation/serialization-schema/*.test.mjs
      - run: node scripts/translate-router.mjs --check
  profile-matrix:
    runs-on: ubuntu-24.04
    # Completed cycle-nine matrix checks reached 2166s. Keep a finite independent
    # 60-minute window, the same immutable SHA and unconditional failure.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - run: node scripts/translate-router.mjs --profile-matrix --check
  reverse-translation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Verify immutable source commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          node --input-type=module -e "
            import {execFileSync} from 'node:child_process';
            const expected = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(expected) || execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim() !== expected) process.exit(1);
          "
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - run: npm ci --prefix packages/javascript --ignore-scripts
      - run: node --test --test-concurrency=2 tools/translation/js-to-rust/test/*.test.mjs
      - run: bun test tools/translation/js-to-rust/test/*.test.mjs
      - run: node scripts/regenerate-js-first.mjs --check
  complete:
    name: JavaScript fully green
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [lint, node-tests, bun-tests, typescript, parity, translation, profile-matrix, reverse-translation]
    if: ${{ always() }}
    steps:
      - name: Require every stage to succeed
        env:
          STAGE_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e "
            const stages = Object.values(JSON.parse(process.env.STAGE_RESULTS));
            if (stages.length !== 8 || stages.some(stage => stage.result !== 'success')) {
              console.error('JavaScript gate rejected:', process.env.STAGE_RESULTS);
              process.exit(1);
            }
          "
