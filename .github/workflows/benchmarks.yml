# Hot-path benchmarks (issue #672): SSE stream translation, request
# translation and token verification (benches/hot_paths.rs). A pull request
# runs them on its base and on its head on the same runner and fails when any
# benchmark's median is more than 25% slower (scripts/compare-benchmarks.rs).
# Absolute numbers on shared runners are noisy; only the relative change is
# judged, and the threshold can be raised for a manual run.
name: Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'rust/src/**'
      - 'rust/benches/**'
      - 'Cargo.toml'
      - 'rust/Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/compare-benchmarks.rs'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:
    inputs:
      base:
        description: Commit, branch or tag to compare against
        default: main
      threshold:
        description: Percent slowdown that fails the run
        default: '25'
      measure_base_coverage:
        description: Measure full coverage of the selected base with the current toolchain
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  javascript:
    if: ${{ github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false' }}
    name: JavaScript first (same commit)
    uses: ./.github/workflows/javascript-manual-development.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read

  resolve-base:
    name: Resolve immutable benchmark base (no Rust)
    needs: [javascript]
    if: needs.javascript.outputs.rust_allowed == 'true' && (needs.javascript.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: source
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base || 'main' }}
        run: |
          sha="$(git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" || git rev-parse --verify "$BASE_REF^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  base-javascript:
    name: JavaScript first (immutable benchmark base)
    needs: [javascript, resolve-base]
    if: needs.javascript.outputs.rust_allowed == 'true' && (needs.javascript.result == 'success' && (needs.resolve-base.result == 'success'))
    uses: ./.github/workflows/javascript-manual-development.yml
    with:
      sha: ${{ needs.resolve-base.outputs.sha }}
    permissions:
      contents: read

  compare:
    if: needs.javascript.outputs.rust_allowed == 'true' && (needs.javascript.result == 'success' && (needs.base-javascript.result == 'success'))
    needs: [javascript, base-javascript, resolve-base]
    name: Compare against base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MEASURE_BASE_COVERAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_base_coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: ${{ env.MEASURE_BASE_COVERAGE == 'true' && 'llvm-tools-preview' || '' }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-cargo-

      - name: Install rust-script
        if: env.MEASURE_BASE_COVERAGE != 'true'
        run: bash scripts/install-ci-cargo-tool.sh rust-script

      - name: Check out the gated base
        env:
          BASE_REF: ${{ needs.resolve-base.outputs.sha }}
        run: |
          # Detached, so a base that is also the checked-out branch (a manual
          # run on main) is accepted; a branch name resolves to its remote tip.
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_REF"

      # A Rust coverage instrumentation change can move the percentage for the
      # same source. Measure the exact gated revision with the release lane's
      # current compiler, tool and full workspace test command.
      - name: Measure base coverage with current Rust
        if: env.MEASURE_BASE_COVERAGE == 'true'
        env:
          LLVM_COV_VERSION: '0.9.2'
          RUSTFLAGS: -Dwarnings
        run: |
          cargo install cargo-llvm-cov --version "$LLVM_COV_VERSION" --locked --force
          cd "$RUNNER_TEMP/base"
          export CARGO_LLVM_COV_TARGET_DIR="$RUNNER_TEMP/base-coverage-target"
          cargo llvm-cov clean --workspace
          # The historical host consumer accepts an explicit executable path.
          # Cargo 1.100 runs its harness outside the CLI's output directory.
          ROUTER_BIN="$CARGO_LLVM_COV_TARGET_DIR/debug/router" \
            cargo llvm-cov --locked --all-features --workspace --no-report
          cargo llvm-cov report --json --summary-only --output-path "$RUNNER_TEMP/base-coverage.json"
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/base-lcov.info"
          jq '.data[0].totals.lines' "$RUNNER_TEMP/base-coverage.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload base coverage
        if: ${{ !cancelled() && env.MEASURE_BASE_COVERAGE == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-coverage
          path: |
            ${{ runner.temp }}/base-coverage.json
            ${{ runner.temp }}/base-lcov.info
          if-no-files-found: error

      - name: Benchmark base
        if: env.MEASURE_BASE_COVERAGE != 'true'
        id: base
        env:
          BASE_REF: ${{ needs.resolve-base.outputs.sha }}
        run: |
          if [ ! -f "$RUNNER_TEMP/base/rust/benches/hot_paths.rs" ] && [ ! -f "$RUNNER_TEMP/base/benches/hot_paths.rs" ]; then
            echo "Base $BASE_REF has no Rust hot_paths benchmark; nothing to compare against." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          # One target directory, so Criterion keeps both baselines side by side.
          cd "$RUNNER_TEMP/base"
          if ! CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo bench --locked --bench hot_paths -- --save-baseline pr-base; then
            echo "::error::Benchmark base $BASE_REF failed. Repair the base ref before rerunning the comparison."
            exit 1
          fi

      - name: Benchmark head
        if: ${{ !cancelled() && env.MEASURE_BASE_COVERAGE != 'true' && (success() || steps.base.outcome == 'failure') }}
        run: cargo bench --locked --bench hot_paths -- --save-baseline pr-head

      - name: Compare
        if: steps.base.outputs.present == 'true'
        env:
          THRESHOLD: ${{ inputs.threshold || '25' }}
        run: rust-script scripts/compare-benchmarks.rs pr-base pr-head --threshold "$THRESHOLD"

      - name: Upload Criterion data
        if: ${{ always() && env.MEASURE_BASE_COVERAGE != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion
          path: target/criterion/
          if-no-files-found: ignore
