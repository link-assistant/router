name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changelog-pr
          - recover
          - publish
          - retry-registries
      release_version:
        description: 'Existing exact version for registry retry (e.g. 1.18.2)'
        required: false
        type: string
      source_run:
        description: 'Tagged source run with successful provenance and macOS lifecycle gates'
        required: false
        type: string
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Complete the Rust stage; the push gate waits for every run before pushing.
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  RUSTFLAGS: -Dwarnings
  # CARGO_REGISTRY_TOKEN is set only on the publishing steps, never here: a
  # workflow-level secret reaches every job, pull request tests included (issue #648).
  DOCKERHUB_IMAGE: konard/link-assistant-router

jobs:
  javascript:
    name: JavaScript first (same commit)
    uses: ./.github/workflows/javascript-first.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read

  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    needs: [javascript]
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: needs.javascript.result == 'success' && (github.event_name != 'workflow_dispatch')
    outputs:
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: rust-script scripts/detect-code-changes.rs

  # === CHANGELOG CHECK - only runs on PRs with code changes ===
  # Docs-only PRs (./docs folder, markdown files) don't require changelog fragments
  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [javascript, detect-changes]
    if: needs.javascript.result == 'success' && (github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Check for changelog fragments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script scripts/check-changelog-fragment.rs

  # === VERSION CHECK - prevents manual version modification in PRs ===
  # This ensures versions are only modified by the automated release pipeline
  version-check:
    needs: [javascript]
    name: Version Modification Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: needs.javascript.result == 'success' && (github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Check for manual version changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script scripts/check-version-modification.rs

  # Build and execute the separately shipped reverse-tunnel image. The echo
  # transport verifies entrypoint validation and the final autossh argv without
  # opening an external SSH connection.
  tunnel-image-smoke:
    if: needs.javascript.result == 'success'
    needs: [javascript]
    name: Tunnel Image Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build tunnel image
        run: docker buildx build --load --file docker/tunnel/Dockerfile --tag router-tunnel:test .
      - name: Missing configuration fails closed
        shell: bash
        run: |
          if docker run --rm router-tunnel:test 2>tunnel-error.log; then
            echo "tunnel image unexpectedly started without configuration" >&2
            exit 1
          fi
          grep -Fq "TUNNEL_SSH_HOST" tunnel-error.log
      - name: Complete configuration reaches autossh
        run: >-
          docker run --rm
          -e TUNNEL_SSH_HOST=far.example
          -e TUNNEL_SSH_USER=router
          -e TUNNEL_REMOTE_PORT=18080
          -e TUNNEL_SSH_KEY=/dev/null
          -e TUNNEL_KNOWN_HOSTS=/etc/hosts
          -e AUTOSSH_BIN=/bin/echo
          router-tunnel:test

  # === LINT AND FORMAT CHECK ===
  # Lint runs independently of changelog check - it's a fast check that should always run
  # See: https://github.com/link-assistant/hive-mind/pull/1024 for why this dependency was removed
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [javascript, detect-changes]
    # Note: always() is required because detect-changes is skipped on workflow_dispatch,
    # and without always(), this job would also be skipped even though its condition includes workflow_dispatch.
    # See: https://github.com/actions/runner/issues/491
    if: needs.javascript.result == 'success' && (always() && !cancelled() && ( github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.any-code-changed == 'true' || needs.detect-changes.outputs.docs-changed == 'true' || needs.detect-changes.outputs.workflow-changed == 'true' ))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      # Compilation-level cache, complementing the artifact cache below.
      # `actions/cache` is keyed on `Cargo.lock`, so a single dependency bump
      # misses the whole `target/` directory; sccache keys on each compilation
      # unit and still hits. Its GHA backend stores in the same Actions cache,
      # so no extra infrastructure is involved.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Scoped to this job rather than the workflow: a job without the step
      # above has no `sccache` binary, and `RUSTC_WRAPPER` pointing at a missing
      # executable fails every cargo invocation outright.
      - name: Route compilation through sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Manifest warnings are not rustc lints, so RUSTFLAGS=-Dwarnings never
      # fails them: "found to be present in multiple build targets" printed on
      # every build since 2026-08-19 (#223) with a green check (issue #648).
      - name: Verify Cargo.lock is current and the manifest is warning-free
        run: |
          set -o pipefail
          cargo check --locked --all-targets --all-features 2>&1 | tee /tmp/cargo-check.log
          if grep -E '^warning' /tmp/cargo-check.log; then
            echo "::error::cargo reported warnings; fix them rather than letting them scroll past"
            exit 1
          fi

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install admin console dependencies
        working-directory: ui
        run: npm ci

      - name: Build admin console
        working-directory: ui
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/admin-ui-build.log
          if grep -E '(^|[[:space:]])\(!\)|[Ww]arn(ing)?' /tmp/admin-ui-build.log; then
            echo "::error::Admin console build emitted a warning"
            exit 1
          fi

      - name: Verify embedded admin console bundle is current
        run: git diff --exit-code -- ui/dist

      - name: Check file size limit
        run: rust-script scripts/check-file-size.rs

      # This project's data structure is a links network, and the wording is
      # load-bearing rather than stylistic -- see the terminology section of
      # CONTRIBUTING.md. Rejected in identifiers and prose alike, any language.
      - name: Check terminology
        run: rust-script scripts/check-terminology.rs

      # The downstream verification command (issue #629): its result parsing,
      # skip accounting, and area-to-target mapping.
      - name: Test contract verification command
        run: rust-script --test scripts/verify-contracts.rs

      # Recorded vendor cassettes (issue #671) stay scrubbed and replayable;
      # offline, no keys needed.
      - name: Check vendor fixture cassettes
        run: rust-script scripts/record-vendor-fixtures.rs --check

      - name: Test bounded remote data checkpoint payload
        run: python3 experiments/issue-642/remote-checkpoint.py

      - name: Test release automation
        run: |
          rust-script --test scripts/version-and-commit.rs
          rust-script --test scripts/check-docker-platforms.rs
          rust-script --test scripts/check-github-releases.rs
          rust-script --test scripts/check-coverage.rs
          rust-script --test scripts/detect-code-changes.rs
          rust-script --test scripts/check-changelog-fragment.rs
          rust-script --test scripts/check-release-provenance.rs
          rust-script --test scripts/check-terminology.rs
          rust-script --test scripts/create-github-release.rs
          python3 experiments/issue-709/release-preparation.py
          python3 experiments/issue-715/test-release-retry.py
          python3 experiments/issue-715/check-remote-names.py
          rust-script --test scripts/check-delivery.rs
          rust-script --test scripts/upload-release-assets.rs
          rust-script --test scripts/check-release-needed.rs
          rust-script scripts/check-release-workflow.rs

      # Job-scoped, unlike the snippet checks above: a tool installed in one job
      # is absent from every other job's fresh runner (issue #648).
      - name: Check every workflow job installs the tools it runs
        run: |
          rust-script --test scripts/check-workflow-tools.rs
          rust-script scripts/check-workflow-tools.rs

  # === DEPENDENCY AUDIT ===
  # Both dependency surfaces the router carries: the Rust crates and the JS
  # toolchain that builds the admin console. Deliberately *not* in `build`'s
  # `needs`, because an advisory can be published against an unchanged tree —
  # that must raise a red check, not block an unrelated release.
  # See docs/security/review-2026-08.md for the review this job came from.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [javascript, detect-changes]
    # Note: always() is required because detect-changes is skipped on workflow_dispatch.
    if: needs.javascript.result == 'success' && (always() && !cancelled() && ( github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.any-code-changed == 'true' || needs.detect-changes.outputs.workflow-changed == 'true' ))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      # Compilation-level cache, complementing the artifact cache below.
      # `actions/cache` is keyed on `Cargo.lock`, so a single dependency bump
      # misses the whole `target/` directory; sccache keys on each compilation
      # unit and still hits. Its GHA backend stores in the same Actions cache,
      # so no extra infrastructure is involved.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Scoped to this job rather than the workflow: a job without the step
      # above has no `sccache` binary, and `RUSTC_WRAPPER` pointing at a missing
      # executable fails every cargo invocation outright.
      - name: Route compilation through sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --force

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Audit admin console dependencies
        working-directory: ui
        run: npm audit --audit-level=high

  # === TEST ===
  # Test runs independently of changelog check
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [javascript, detect-changes, changelog]
    # Run if: push event, OR changelog succeeded, OR changelog was skipped (docs-only PR)
    if: needs.javascript.result == 'success' && (always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success' || needs.changelog.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      # Compilation-level cache, complementing the artifact cache below.
      # `actions/cache` is keyed on `Cargo.lock`, so a single dependency bump
      # misses the whole `target/` directory; sccache keys on each compilation
      # unit and still hits. Its GHA backend stores in the same Actions cache,
      # so no extra infrastructure is involved.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Scoped to this job rather than the workflow: a job without the step
      # above has no `sccache` binary, and `RUSTC_WRAPPER` pointing at a missing
      # executable fails every cargo invocation outright.
      - name: Route compilation through sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --locked --all-features --verbose

      - name: Repeat default-parallel wrapper sweep tests
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          temporary_root="$(mktemp -d)"
          trap 'rm -rf "$temporary_root"' EXIT
          for attempt in {1..20}; do
            TMPDIR="$temporary_root" cargo test --locked --all-features --lib with_command -- --nocapture
          done

      # A running client must keep blocking backup and maintenance of the
      # profile it writes. On macOS that check reads other processes through
      # `ps -E`, which SIP and timing can both affect, so one green run proves
      # little: repeat it, in parallel and one test at a time (issue #619).
      - name: Repeat the active-client safety tests
        if: runner.os == 'macOS'
        run: |
          csrutil status || true
          for attempt in 1 2 3 4 5; do
            cargo test --locked --all-features --test clients_active_profile_test
            cargo test --locked --all-features --test clients_active_profile_test -- --test-threads=1
          done

      - name: Verify restore through a system temporary-directory alias
        if: runner.os != 'Windows'
        run: python3 experiments/issue-642/restore-temp-alias.py --cargo

      - name: Compile Windows tests
        if: runner.os == 'Windows'
        run: cargo test --locked --all-features --verbose --no-run

      - name: Verify Windows process ownership with a bounded runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @(
            'test', '--locked', '--all-features', '--verbose',
            '--lib', 'bounded_process::tests', '--', '--test-threads=1', '--nocapture'
          )
          $process = Start-Process -FilePath cargo -ArgumentList $arguments -NoNewWindow -PassThru
          if (-not $process.WaitForExit(180000)) {
            taskkill /PID $process.Id /T /F
            throw 'Windows process ownership tests exceeded 180 seconds'
          }
          exit $process.ExitCode

      - name: Run Windows library and binary tests
        if: runner.os == 'Windows'
        env:
          ROUTER_DEPLOY_TRACE: '1'
          RUST_BACKTRACE: '1'
        run: cargo test --locked --all-features --verbose --lib --bins -- --test-threads=1 --nocapture

      - name: Run Windows integration tests with bounded targets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testFiles = Get-ChildItem tests -File -Filter '*_test.rs' | Sort-Object Name
          foreach ($testFile in $testFiles) {
            $target = $testFile.BaseName
            Write-Host "::group::Windows integration target $target"
            $arguments = @(
              'test', '--locked', '--all-features', '--verbose',
              '--test', $target, '--', '--test-threads=1'
            )
            $process = Start-Process -FilePath cargo -ArgumentList $arguments -NoNewWindow -PassThru
            if (-not $process.WaitForExit(180000)) {
              taskkill /PID $process.Id /T /F
              Write-Host '::endgroup::'
              throw "Windows integration target $target exceeded 180 seconds"
            }
            $exitCode = $process.ExitCode
            Write-Host '::endgroup::'
            if ($exitCode -ne 0) {
              exit $exitCode
            }
          }

      - name: Run doc tests
        run: cargo test --locked --doc --verbose

  # === COVERAGE ===
  # Instrument once on Linux; platform-specific behavior remains covered by the test matrix.
  coverage:
    name: Test Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [javascript, detect-changes, changelog]
    if: needs.javascript.result == 'success' && (always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success' || needs.changelog.result == 'skipped'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview

      - name: Cache coverage tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-coverage-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-v2-

      - name: Install coverage tools
        run: |
          if ! cargo llvm-cov --version 2>/dev/null | grep -Fqx 'cargo-llvm-cov 0.9.1'; then
            cargo install cargo-llvm-cov --version 0.9.1 --locked --force
          fi
          command -v rust-script >/dev/null || cargo install rust-script --version 0.36.0 --locked

      - name: Test coverage gate behavior
        run: rust-script --test scripts/check-coverage.rs

      - name: Run instrumented tests
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --all-features --workspace --no-report

      - name: Generate coverage reports
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage-summary.json
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Read default-branch baseline
        id: base-coverage
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ] && git show "origin/${BASE_REF}:coverage-baseline.txt" > /tmp/base-coverage-baseline.txt 2>/dev/null; then
            echo "argument=--previous-baseline /tmp/base-coverage-baseline.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce coverage floor and ratchet
        shell: bash
        env:
          BASELINE_ARGUMENT: ${{ steps.base-coverage.outputs.argument }}
          COVERAGE_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-exception') }}
        run: |
          args=(--report coverage-summary.json --baseline coverage-baseline.txt --summary "$GITHUB_STEP_SUMMARY")
          if [ -n "$BASELINE_ARGUMENT" ]; then
            args+=(--previous-baseline /tmp/base-coverage-baseline.txt)
          fi
          if [ "$COVERAGE_EXCEPTION" = "true" ]; then
            args+=(--allow-decrease)
          fi
          rust-script scripts/check-coverage.rs "${args[@]}"

      - name: Require reviewable baseline update
        shell: bash
        run: |
          if ! git diff --exit-code -- coverage-baseline.txt; then
            echo "::error::Coverage changed the baseline. Commit coverage-baseline.txt so the ratchet update is reviewable."
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-lcov
          path: |
            lcov.info
            coverage-summary.json
          if-no-files-found: warn

  # === BUILD ===
  # Build package - only runs if lint and test pass
  build:
    name: Build Package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [javascript, lint, test, coverage]
    if: needs.javascript.result == 'success' && (always() && !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' && needs.coverage.result == 'success')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      # Compilation-level cache, complementing the artifact cache below.
      # `actions/cache` is keyed on `Cargo.lock`, so a single dependency bump
      # misses the whole `target/` directory; sccache keys on each compilation
      # unit and still hits. Its GHA backend stores in the same Actions cache,
      # so no extra infrastructure is involved.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Scoped to this job rather than the workflow: a job without the step
      # above has no `sccache` binary, and `RUSTC_WRAPPER` pointing at a missing
      # executable fails every cargo invocation outright.
      - name: Route compilation through sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        run: cargo build --locked --release --verbose

      - name: Check package
        run: cargo package --locked --list

  # === AUTO RELEASE ===
  # Automatic release on push to main using changelog fragments
  # This job automatically bumps version based on fragments in changelog.d/
  auto-release:
    name: Auto Release
    needs: [javascript, lint, test, build]
    outputs:
      should-release: ${{ steps.check.outputs.should_release }}
      release-version: ${{ steps.current_version.outputs.version }}
    # Note: always() ensures consistent behavior with other jobs that depend on jobs using always().
    if: needs.javascript.result == 'success' && (always() && !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'recover')) && github.ref == 'refs/heads/main' && needs.build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Configure git
        run: rust-script scripts/git-config.rs

      - name: Determine bump type from changelog fragments
        id: bump_type
        run: rust-script scripts/get-bump-type.rs

      - name: Check if version already released or no fragments
        id: check
        env:
          HAS_FRAGMENTS: ${{ steps.bump_type.outputs.has_fragments }}
          RECOVER_DELIVERY: ${{ github.event.inputs.release_mode == 'recover' }}
        run: rust-script scripts/check-release-needed.rs

      - name: Collect changelog and bump version
        id: version
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.skip_bump != 'true'
        run: |
          rust-script scripts/version-and-commit.rs \
            --bump-type "${{ steps.bump_type.outputs.bump_type }}"

      - name: Get current version
        id: current_version
        if: steps.check.outputs.should_release == 'true'
        # Version creation changes HEAD. No Rust executes again until the new
        # immutable tag commit has passed release-javascript below.
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const version = fs.readFileSync('Cargo.toml', 'utf8').match(/^version\s*=\s*\"([^\"]+)\"/m)[1];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');
          "

  # === MANUAL INSTANT RELEASE ===
  # Manual release via workflow_dispatch - only after CI passes
  manual-release:
    name: Instant Release
    needs: [javascript, lint, test, build]
    outputs:
      should-release: ${{ steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true' }}
      release-version: ${{ steps.version.outputs.new_version }}
    # Note: always() is required to evaluate the condition when dependencies use always().
    # The build job ensures lint and test passed before this job runs.
    if: needs.javascript.result == 'success' && (always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant' && needs.build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Configure git
        run: rust-script scripts/git-config.rs

      - name: Collect changelog fragments
        run: rust-script scripts/collect-changelog.rs

      - name: Version and commit
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: rust-script scripts/version-and-commit.rs --bump-type "$BUMP_TYPE" --description "$DESCRIPTION"

      # Tagged source is built only after release-javascript, never immediately
      # after a version commit that has not passed the JavaScript checks.

  # Build every image variant and architecture on a native runner. Each matrix
  # leg pushes a digest; the following job gives those digests their tags.
  publish-docker-images:
    name: Build Docker Image (${{ matrix.variant }} / ${{ matrix.arch }})
    needs: [javascript, release-javascript, resolve-release-source, create-github-release]
    if: needs.javascript.result == 'success' && (needs.release-javascript.result == 'success' && (always() && !cancelled() && needs.create-github-release.result == 'success' && github.ref == format('refs/tags/v{0}', needs.create-github-release.outputs.release-version)))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            variant: runtime
            target: runtime
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            variant: runtime
            target: runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_VERSION: ${{ needs.create-github-release.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.create-github-release.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.sha }}

      - name: Verify the workspace is the release tag commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: konard
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: type=raw,value=${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.source=https://github.com/link-assistant/router

      # metadata-action always emits org.opencontainers.image.revision=github.sha, which on a
      # release push is the merge commit *before* the release commit. Passing a second value
      # for the same key would leave the winner up to label ordering, so drop the generated
      # entry and append the commit the release tag actually resolves to.
      - name: Pin the image revision to the release tag commit
        id: image-labels
        shell: bash
        env:
          GENERATED_LABELS: ${{ steps.docker-meta.outputs.labels }}
        run: |
          {
            echo 'labels<<LABELS_EOF'
            grep -v '^org.opencontainers.image.revision=' <<<"$GENERATED_LABELS"
            echo "org.opencontainers.image.revision=${RELEASE_COMMIT}"
            echo 'LABELS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image by digest
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: ROUTER_SOURCE_COMMIT=${{ env.RELEASE_COMMIT }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.image-labels.outputs.labels }}
          outputs: type=image,"name=ghcr.io/${{ github.repository }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-${{ matrix.variant }}
          provenance: mode=max
          sbom: true

      # Fail before the digest is ever tagged if the built config still carries the
      # workflow-context revision instead of the tag commit.
      - name: Verify image labels record the release tag commit
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        shell: bash
        run: |
          labels="$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}@${IMAGE_DIGEST}" --format '{{json .Image}}' | jq '.config.Labels')"
          echo "$labels"
          test "$(jq -r '."org.opencontainers.image.revision"' <<<"$labels")" = "$RELEASE_COMMIT"
          test "$(jq -r '."org.opencontainers.image.version"' <<<"$labels")" = "$RELEASE_VERSION"

      - name: Attest GHCR image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: true

      - name: Verify published image attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify "oci://ghcr.io/${{ github.repository }}@${{ steps.build-image.outputs.digest }}" --repo "${{ github.repository }}" --source-ref "refs/tags/v${RELEASE_VERSION}" --source-digest "${RELEASE_COMMIT}"

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          mkdir -p "/tmp/digests/${{ matrix.variant }}"
          touch "/tmp/digests/${{ matrix.variant }}/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.variant }}/*
          if-no-files-found: error
          retention-days: 1

  publish-docker-manifests:
    name: Publish Multi-Platform Docker Manifests
    needs: [javascript, release-javascript, resolve-release-source, create-github-release, publish-docker-images]
    if: needs.javascript.result == 'success' && (needs.release-javascript.result == 'success' && (always() && !cancelled() && needs.publish-docker-images.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.create-github-release.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.create-github-release.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.sha }}
          fetch-depth: 0

      - name: Verify the workspace is the release tag commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: konard
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Download runtime digests
        # v8's bundled unzip chain (unzip-stream -> binary/buffers) still calls the
        # deprecated `Buffer()` constructor, so Node 24 prints DEP0005 on every
        # download (upstream actions/download-artifact#484, still open). The
        # artifacts here are zips, so the extraction path cannot be avoided with
        # `skip-decompress`; silencing the deprecation notice for this one step
        # keeps the log clean without pinning away from v8's stricter defaults --
        # a digest mismatch now fails the run instead of warning, which is exactly
        # what should stop a release.
        env:
          NODE_OPTIONS: --no-deprecation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          path: /tmp/digests/runtime
          merge-multiple: true

      - name: Create multi-platform manifests
        shell: bash
        run: |
          ghcr_runtime=()
          dockerhub_runtime=()
          for digest in /tmp/digests/runtime/*; do
            hash="$(basename "$digest")"
            ghcr_runtime+=("ghcr.io/${{ github.repository }}@sha256:$hash")
            dockerhub_runtime+=("${{ env.DOCKERHUB_IMAGE }}@sha256:$hash")
          done
          publish_manifest() {
            registry="$1"
            shift
            reference="${registry}:${RELEASE_VERSION}"
            if docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' > /tmp/existing-manifest.json 2>/tmp/manifest-error.log; then
              rust-script scripts/check-release-provenance.rs \
                --release-version "$RELEASE_VERSION" --expected-commit "$RELEASE_COMMIT" \
                --repository "${{ github.repository }}" --image "$reference"
              digest="$(jq -er '.digest | select(startswith("sha256:"))' /tmp/existing-manifest.json)"
              # Retain the immutable version identity. Only latest is movable.
              docker buildx imagetools create -t "${registry}:latest" "${registry}@${digest}"
            else
              # A network/auth failure cannot authorize replacing a version.
              grep -Eqi 'manifest unknown|not found' /tmp/manifest-error.log || {
                cat /tmp/manifest-error.log >&2
                return 1
              }
              docker buildx imagetools create \
                -t "${registry}:latest" -t "$reference" "$@"
            fi
          }
          publish_manifest "ghcr.io/${{ github.repository }}" "${ghcr_runtime[@]}"
          publish_manifest "${{ env.DOCKERHUB_IMAGE }}" "${dockerhub_runtime[@]}"

      - name: Verify GHCR package is publicly pullable
        env:
          GHCR_IMAGE: ghcr.io/link-assistant/router
        run: bash scripts/verify-ghcr-visibility.sh

      - name: Verify multi-platform Docker manifests
        run: |
          rust-script scripts/check-docker-platforms.rs \
            "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}:${{ env.RELEASE_VERSION }}" \
            "${{ env.DOCKERHUB_IMAGE }}:latest" \
            "${{ env.DOCKERHUB_IMAGE }}:${{ env.RELEASE_VERSION }}"

      # Post-publication guard: re-resolve the annotated tag and compare it against the
      # revision every published platform manifest claims.
      - name: Verify published image provenance
        run: |
          rust-script scripts/check-release-provenance.rs \
            --release-version "${RELEASE_VERSION}" \
            --expected-commit "${RELEASE_COMMIT}" \
            --repository "${{ github.repository }}" \
            --image "ghcr.io/${{ github.repository }}:${RELEASE_VERSION}" \
            --image "ghcr.io/${{ github.repository }}:latest" \
            --image "${{ env.DOCKERHUB_IMAGE }}:${RELEASE_VERSION}" \
            --image "${{ env.DOCKERHUB_IMAGE }}:latest"

  resolve-release-source:
    name: Resolve immutable release source (no Rust)
    needs: [javascript, auto-release, manual-release]
    if: needs.javascript.result == 'success' && (always() && !cancelled() && ((needs.auto-release.result == 'success' && needs.auto-release.outputs.should-release == 'true') || (needs.manual-release.result == 'success' && needs.manual-release.outputs.should-release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'publish' && startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    env:
      RELEASE_VERSION: ${{ needs.auto-release.outputs.release-version || needs.manual-release.outputs.release-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: source
        shell: bash
        run: |
          if [ "${{ inputs.release_mode }}" = publish ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          git fetch --force --tags --quiet
          sha="$(git rev-parse --verify "refs/tags/v${RELEASE_VERSION}^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  release-javascript:
    name: JavaScript first (immutable release commit)
    needs: [javascript, resolve-release-source]
    if: needs.javascript.result == 'success' && (always() && needs.resolve-release-source.result == 'success')
    uses: ./.github/workflows/javascript-first.yml
    with:
      sha: ${{ needs.resolve-release-source.outputs.sha }}
    permissions:
      contents: read

  create-github-release:
    name: Prepare GitHub Prerelease
    needs: [javascript, release-javascript, resolve-release-source, auto-release, manual-release]
    if: needs.javascript.result == 'success' && (needs.release-javascript.result == 'success' && (always() && !cancelled() && ( (needs.auto-release.result == 'success' && needs.auto-release.outputs.should-release == 'true') || (needs.manual-release.result == 'success' && needs.manual-release.outputs.should-release == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'publish' && startsWith(github.ref, 'refs/tags/v')) )))
    outputs:
      release-version: ${{ steps.tag-commit.outputs.version }}
      release-commit: ${{ steps.tag-commit.outputs.commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_VERSION: ${{ needs.auto-release.outputs.release-version || needs.manual-release.outputs.release-version }}
    steps:
      - name: Resolve publishing version from tag context
        if: github.event.inputs.release_mode == 'publish'
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.sha }}
          fetch-depth: 0

      # Every packaging job must build the immutable tag commit, not the commit that
      # triggered this run: the release commit is created *after* the trigger, so
      # github.sha still names the previous merge commit (issue #191).
      - name: Resolve release tag commit
        id: tag-commit
        shell: bash
        run: |
          git fetch --force --tags --quiet
          commit="$(git rev-parse "refs/tags/v${RELEASE_VERSION}^{commit}")"
          if [ "$commit" != "$(git rev-parse HEAD)" ]; then
            echo "::error::v${RELEASE_VERSION} resolves to $commit but the workspace is $(git rev-parse HEAD)"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "v${RELEASE_VERSION} -> $commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      # Surface orphan tags left by earlier runs *before* anything is published, so the
      # log names them while they can still be fixed without a half-finished release.
      # They only warn here: an unrelated historical orphan must not block today's images.
      # The scheduled verify-releases workflow still fails hard on them.
      - name: Report pre-existing release drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-github-releases.rs --repository "${{ github.repository }}" --default-branch main --historical-orphans warn

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/create-github-release.rs --release-version "${{ env.RELEASE_VERSION }}" --repository "${{ github.repository }}" --crates-io-url "https://crates.io/crates/link-assistant-router" --docker-hub-url "https://hub.docker.com/r/konard/link-assistant-router" --prerelease true

      # Scoped to the version just published: this run is responsible for that release only.
      - name: Verify GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-github-releases.rs --repository "${{ github.repository }}" --default-branch main --release-version "${{ env.RELEASE_VERSION }}" --historical-orphans warn

      - name: Dispatch publishing with the release tag as source
        if: github.event.inputs.release_mode != 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh workflow run release.yml --repo "${{ github.repository }}"
          --ref "v${RELEASE_VERSION}" -f release_mode=publish -f bump_type=patch

  publish-release-artifacts:
    name: Publish attested binaries (${{ matrix.os }}-${{ matrix.arch }})
    needs: [javascript, release-javascript, resolve-release-source, create-github-release]
    if: needs.javascript.result == 'success' && (needs.release-javascript.result == 'success' && (always() && !cancelled() && needs.create-github-release.result == 'success' && github.ref == format('refs/tags/v{0}', needs.create-github-release.outputs.release-version)))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Both Darwin slices are produced on the Apple Silicon runner: the
          # Xcode SDK it ships builds either architecture, so the x86_64 asset
          # does not depend on the shrinking pool of Intel macOS runners.
          - os: darwin
            arch: arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - os: darwin
            arch: amd64
            runner: macos-26
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.create-github-release.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.create-github-release.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.sha }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      # Each job starts on a fresh runner: without this step the upload below
      # exits 127 and the release ships no binaries (issue #648, v1.15.0).
      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Verify tag and package version
        shell: bash
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "link-assistant-router") | .version')"
          test "$package_version" = "$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "v${RELEASE_VERSION}^{commit}")" = "$RELEASE_COMMIT"

      - name: Build release binaries
        run: cargo build --locked --release --bins --target ${{ matrix.target }}

      - name: Install pinned CycloneDX generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Package binaries, checksums, and CycloneDX SBOM
        shell: bash
        env:
          PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
        run: |
          mkdir -p dist/package
          # `router` is the canonical command (issue #222); the other two names
          # ship beside it so existing scripts and deployment units keep working.
          # A name missing here is absent from every published archive, which is
          # how `router` shipped in v0.92.0 without reaching anyone who installs
          # from a release rather than with `cargo install`.
          cp "target/${{ matrix.target }}/release/router" \
            "target/${{ matrix.target }}/release/link-assistant-router" \
            "target/${{ matrix.target }}/release/with-router" dist/package/
          cp LICENSE README.md dist/package/
          cargo cyclonedx --format json --all-features --all --spec-version 1.5 \
            --override-filename link-assistant-router.cdx
          mv link-assistant-router.cdx.json \
            "dist/link-assistant-router-${RELEASE_VERSION}-${PLATFORM}.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 1) and (.dependencies | length > 0)' \
            "dist/link-assistant-router-${RELEASE_VERSION}-${PLATFORM}.cdx.json" >/dev/null
          tar -C dist/package -czf "dist/link-assistant-router-${RELEASE_VERSION}-${PLATFORM}.tar.gz" .
          rm -rf dist/package
          # macOS ships `shasum` instead of GNU coreutils' `sha256sum`; both
          # emit the same "<digest>  <path>" lines consumers verify against.
          # Digest the assets from inside dist/ so the recorded names are the flat
          # names `gh release download` writes; a `dist/` prefix makes a consumer's
          # `sha256sum -c` fail with "No such file or directory".
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -- *.tar.gz *.cdx.json
            else
              shasum -a 256 -- *.tar.gz *.cdx.json
            fi
          ) > "dist/link-assistant-router-${RELEASE_VERSION}-${PLATFORM}.sha256"
          # Smoke test the published checksum file the way a consumer runs it: flat,
          # in the directory the assets were downloaded into.
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c "link-assistant-router-${RELEASE_VERSION}-${PLATFORM}.sha256"
            else
              shasum -a 256 -c "link-assistant-router-${RELEASE_VERSION}-${PLATFORM}.sha256"
            fi
          )

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/upload-release-assets.rs

      - name: Verify attestations and release asset identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "${{ github.repository }}" --source-ref "refs/tags/v${RELEASE_VERSION}" --source-digest "${RELEASE_COMMIT}"
          done
          assets="$(gh release view "v${RELEASE_VERSION}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          for expected in \
            "link-assistant-router-${RELEASE_VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            "link-assistant-router-${RELEASE_VERSION}-${{ matrix.os }}-${{ matrix.arch }}.cdx.json" \
            "link-assistant-router-${RELEASE_VERSION}-${{ matrix.os }}-${{ matrix.arch }}.sha256"; do
            grep -Fqx "$expected" <<<"$assets"
          done

  # === POST-PUBLICATION PROVENANCE GUARD ===
  # Everything above trusts the release-commit output computed at tag time. This job
  # starts from the default branch, re-resolves the annotated tag itself, and compares
  # that commit against what was actually published: the labels on both platform
  # manifests in both registries, and the attestations of the downloadable archives.
  # It also runs the consumer's own `sha256sum -c` in the download directory.
  publish-integration-artifacts:
    name: Build and attest official integrations
    needs: [javascript, release-javascript, resolve-release-source, create-github-release]
    if: needs.javascript.result == 'success' && (needs.release-javascript.result == 'success' && (always() && !cancelled() && needs.create-github-release.result == 'success' && github.ref == format('refs/tags/v{0}', needs.create-github-release.outputs.release-version)))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_VERSION: ${{ needs.create-github-release.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.create-github-release.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve-release-source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - name: Verify immutable release source and package versions
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          cargo build --locked --bins
          python3 scripts/generate-contracts.py --check
          python3 scripts/generate-bindings.py --check
      - run: npm ci && npm test && npm run typecheck
        working-directory: packages/javascript
      - run: python3 -m pip install -e packages/python build
      - run: python3 -m unittest discover -s packages/python/tests -v
      - run: python3 scripts/package-integrations.py --output dist-integrations
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist-integrations/*
      - name: Verify and attach integrations and language-neutral contracts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for artifact in dist-integrations/*; do
            gh attestation verify "$artifact" --repo "${{ github.repository }}" --source-ref "refs/tags/v${RELEASE_VERSION}" --source-digest "$RELEASE_COMMIT"
          done
          gh release upload "v${RELEASE_VERSION}" dist-integrations/* --repo "${{ github.repository }}"

  verify-release-provenance:
    name: Verify published release provenance
    needs: [javascript, create-github-release, publish-docker-manifests, publish-release-artifacts, publish-integration-artifacts]
    if: needs.javascript.result == 'success' && (always() && !cancelled() && needs.publish-docker-manifests.result == 'success' && needs.publish-release-artifacts.result == 'success' && needs.publish-integration-artifacts.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_VERSION: ${{ needs.create-github-release.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.create-github-release.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: konard
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # Resolve the immutable tag before verifying its exact source identity.
      - name: Fetch the release tag
        run: |
          git fetch --force --tags --quiet
          git rev-parse "refs/tags/v${RELEASE_VERSION}^{commit}" >/dev/null

      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p published
          gh release download "v${RELEASE_VERSION}" --repo "${{ github.repository }}" --dir published --clobber

      - name: Verify checksums exactly as a consumer does
        shell: bash
        run: |
          cd published
          shopt -s nullglob
          checksums=(*.sha256)
          if [ "${#checksums[@]}" -eq 0 ]; then
            echo "::error::the release published no checksum files"
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            sha256sum -c "$checksum"
          done

      - name: Download architecture digests for strict attestation verification
        env:
          NODE_OPTIONS: --no-deprecation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          path: image-digests
          merge-multiple: true

      - name: Verify tagged source of every published asset and image architecture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for artifact in published/*; do
            gh attestation verify "$artifact" --repo "${{ github.repository }}" --source-ref "refs/tags/v${RELEASE_VERSION}" --source-digest "${RELEASE_COMMIT}"
          done
          for digest in image-digests/*; do
            gh attestation verify "oci://ghcr.io/${{ github.repository }}@sha256:${digest##*/}" --repo "${{ github.repository }}" --source-ref "refs/tags/v${RELEASE_VERSION}" --source-digest "${RELEASE_COMMIT}"
          done

      - name: Verify every artifact points at the release tag commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rust-script scripts/check-release-provenance.rs \
            --release-version "${RELEASE_VERSION}" \
            --expected-commit "${RELEASE_COMMIT}" \
            --repository "${{ github.repository }}" \
            --image "ghcr.io/${{ github.repository }}:${RELEASE_VERSION}" \
            --image "${{ env.DOCKERHUB_IMAGE }}:${RELEASE_VERSION}" \
            --asset-dir published

  # === MACOS HOST CLI LIFECYCLE ===
  verify-macos-client-lifecycle:
    name: Verify macOS client lifecycle
    needs: [javascript, release-javascript, resolve-release-source, create-github-release, publish-release-artifacts]
    if: needs.javascript.result == 'success' && (needs.release-javascript.result == 'success' && (always() && !cancelled() && needs.publish-release-artifacts.result == 'success'))
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.create-github-release.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.create-github-release.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.sha }}

      - name: Verify the workspace is the release tag commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Download and verify the published darwin-arm64 asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: darwin-arm64
        run: |
          mkdir -p dist
          gh release download "v${RELEASE_VERSION}" --repo "${{ github.repository }}" --dir dist \
            --pattern "link-assistant-router-${RELEASE_VERSION}-${PLATFORM}.*"
          (cd dist && shasum -a 256 -c "link-assistant-router-${RELEASE_VERSION}-${PLATFORM}.sha256")
          mkdir -p dist/package
          tar -C dist/package -xzf "dist/link-assistant-router-${RELEASE_VERSION}-${PLATFORM}.tar.gz"
          # The shipped binaries must run natively before the lifecycle is
          # tried. `router` is checked first: it is the canonical command, and
          # asserting it here is what would have caught its absence from the
          # v0.92.0 archives (issue #222).
          dist/package/router --version
          dist/package/link-assistant-router --version
          dist/package/with-router --help >/dev/null

      - name: Forward the remote router to a localhost port
        id: forward
        shell: bash
        env:
          ROUTER_SSH_TARGET: ${{ secrets.ROUTER_SSH_TARGET }}
          ROUTER_SSH_KEY: ${{ secrets.ROUTER_SSH_KEY }}
          ROUTER_REMOTE_ADDRESS: ${{ secrets.ROUTER_REMOTE_ADDRESS }}
        run: |
          if [ -z "$ROUTER_SSH_TARGET" ] || [ -z "$ROUTER_SSH_KEY" ] || [ -z "$ROUTER_REMOTE_ADDRESS" ]; then
            echo "SSH secrets are absent; skipping the remote lifecycle."
            echo "forwarded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ROUTER_SSH_KEY" > ~/.ssh/router_release
          chmod 600 ~/.ssh/router_release
          ssh-keyscan -H "${ROUTER_SSH_TARGET#*@}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/router_release -f -N -o ExitOnForwardFailure=yes \
            -L "18080:${ROUTER_REMOTE_ADDRESS}" "$ROUTER_SSH_TARGET"
          echo "forwarded=true" >> "$GITHUB_OUTPUT"

      - name: Run the host CLI lifecycle against the forwarded router
        if: steps.forward.outputs.forwarded == 'true'
        env:
          ROUTER_HOST_CLI_TESTS: "1"
          ROUTER_HOST_CLI_URL: http://127.0.0.1:18080
          ROUTER_HOST_CLI_TOKEN: ${{ secrets.ROUTER_HOST_CLI_TOKEN }}
        run: cargo test --locked --test host_client_lifecycle_test -- --nocapture

  # Retry existing, attested distributions using current release logic. Never
  # rebuild assets or rewrite the old tag to repair publisher configuration.
  prepare-registry-retry:
    needs: [javascript]
    name: Verify existing release for registry retry
    if: needs.javascript.result == 'success' && (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'retry-registries' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      release-version: ${{ steps.source.outputs.version }}
      release-commit: ${{ steps.source.outputs.commit }}
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate the exact source and successful existing delivery gates
        id: source
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python3 scripts/prepare-registry-retry.py --repository "${{ github.repository }}" --version "$RELEASE_VERSION" --source-run "$SOURCE_RUN" --output "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - name: Reverify existing assets and image provenance without rebuilding
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          mkdir published
          gh release download "v${RELEASE_VERSION}" --repo "${{ github.repository }}" --dir published
          for artifact in published/*; do
            gh attestation verify "$artifact" --repo "${{ github.repository }}" --source-ref "refs/tags/v${RELEASE_VERSION}" --source-digest "$RELEASE_COMMIT"
          done
          (cd published && sha256sum -c -- *.sha256)
          rust-script scripts/check-release-provenance.rs \
            --release-version "$RELEASE_VERSION" --expected-commit "$RELEASE_COMMIT" \
            --repository "${{ github.repository }}" --asset-dir published \
            --image "ghcr.io/${{ github.repository }}:${RELEASE_VERSION}" \
            --image "${{ env.DOCKERHUB_IMAGE }}:${RELEASE_VERSION}"

  # === STABLE PUBLICATION ===
  publish-npm:
    name: Publish verified npm package
    needs: [javascript, create-github-release, verify-release-provenance, verify-macos-client-lifecycle, prepare-registry-retry]
    if: needs.javascript.result == 'success' && (always() && !cancelled() && ((needs.verify-release-provenance.result == 'success' && needs.verify-macos-client-lifecycle.result == 'success') || needs.prepare-registry-retry.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.create-github-release.outputs.release-version || needs.prepare-registry-retry.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.create-github-release.outputs.release-commit || needs.prepare-registry-retry.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download and verify exact tagged package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${RELEASE_VERSION}" --repo "${{ github.repository }}" --pattern "link-assistant-router-${RELEASE_VERSION}.tgz"
          gh attestation verify "link-assistant-router-${RELEASE_VERSION}.tgz" --repo "${{ github.repository }}" --source-ref "refs/tags/v${RELEASE_VERSION}" --source-digest "$RELEASE_COMMIT"
      - name: Check for an already delivered identical npm distribution
        id: registry
        run: python3 scripts/registry-distributions.py npm --version "$RELEASE_VERSION" --assets . --probe >> "$GITHUB_OUTPUT"
      - name: Publish the attested npm distribution
        if: steps.registry.outputs.present != 'true'
        # Optional approved bootstrap token. Ordinary releases use npm OIDC.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "link-assistant-router-${RELEASE_VERSION}.tgz" --access public --provenance
      - name: Verify npm hashes and ordinary exact-version install
        run: python3 scripts/registry-distributions.py npm --version "$RELEASE_VERSION" --assets .

  publish-python:
    name: Publish verified Python package
    needs: [javascript, create-github-release, verify-release-provenance, verify-macos-client-lifecycle, prepare-registry-retry]
    if: needs.javascript.result == 'success' && (always() && !cancelled() && ((needs.verify-release-provenance.result == 'success' && needs.verify-macos-client-lifecycle.result == 'success') || needs.prepare-registry-retry.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.create-github-release.outputs.release-version || needs.prepare-registry-retry.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.create-github-release.outputs.release-commit || needs.prepare-registry-retry.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - name: Download and verify exact tagged Python distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "v${RELEASE_VERSION}" --repo "${{ github.repository }}" --pattern "link_assistant_router-${RELEASE_VERSION}*" --dir dist
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "${{ github.repository }}" --source-ref "refs/tags/v${RELEASE_VERSION}" --source-digest "$RELEASE_COMMIT"
          done
      - name: Check for already delivered identical Python distributions
        id: registry
        run: python3 scripts/registry-distributions.py python --version "$RELEASE_VERSION" --assets dist --probe >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: steps.registry.outputs.present != 'true'
        with:
          packages-dir: dist
      - name: Verify PyPI hashes and ordinary exact-version install
        run: python3 scripts/registry-distributions.py python --version "$RELEASE_VERSION" --assets dist

  finalize-release:
    name: Publish complete stable release
    needs: [javascript, create-github-release, publish-docker-manifests, publish-release-artifacts, verify-release-provenance, verify-macos-client-lifecycle, publish-npm, publish-python, prepare-registry-retry]
    if: needs.javascript.result == 'success' && (always() && !cancelled() && ((needs.create-github-release.result == 'success' && needs.publish-docker-manifests.result == 'success' && needs.publish-release-artifacts.result == 'success' && needs.verify-release-provenance.result == 'success' && needs.verify-macos-client-lifecycle.result == 'success') || needs.prepare-registry-retry.result == 'success') && needs.publish-npm.result == 'success' && needs.publish-python.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.create-github-release.outputs.release-version || needs.prepare-registry-retry.outputs.release-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked
      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: rust-script scripts/publish-crate.rs
      - name: Wait for Crate availability on Crates.io
        run: rust-script scripts/wait-for-crate.rs --release-version "${{ env.RELEASE_VERSION }}"
      - name: Promote verified release to stable and latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${RELEASE_VERSION}" --repo "${{ github.repository }}" --prerelease=false --latest
      - name: Verify GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-github-releases.rs --repository "${{ github.repository }}" --default-branch main --release-version "${{ env.RELEASE_VERSION }}" --historical-orphans warn

  # === MANUAL CHANGELOG PR ===
  changelog-pr:
    needs: [javascript]
    name: Create Changelog PR
    if: needs.javascript.result == 'success' && (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changelog-pr')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked

      - name: Create changelog fragment
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: rust-script scripts/create-changelog-fragment.rs --bump-type "$BUMP_TYPE" --description "$DESCRIPTION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changelog for manual ${{ github.event.inputs.bump_type }} release'
          branch: changelog-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changelog fragment in this PR
            2. Merge this PR to main
            3. The automated release workflow will publish to crates.io and create a GitHub release
