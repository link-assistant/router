name: issue-285-fix

on:
  push:
    branches:
      - fix/auth-import-explicit-source
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add regression test and prove it fails before the fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/subscription_tests.rs")
          text = path.read_text()
          marker = "/// A home with no credential is an error naming the home, not an empty import."
          assert marker in text
          assert "explicit_import_home_does_not_adopt_keychain_credential" not in text
          test = r'''

          /// An explicitly named source home must not be overridden by the
          /// machine-wide keychain credential, even when the store is newer
          /// (issue #285).
          #[test]
          fn explicit_import_home_does_not_adopt_keychain_credential() {
              let dir = tempfile::tempdir().unwrap();
              let reader = claude_home_expiring_at(dir.path(), 1_000);
              let store = serde_json::json!({
                  "claudeAiOauth": {
                      "accessToken": "keychain-access",
                      "refreshToken": "keychain-refresh",
                      "expiresAt": 9_999_999_i64,
                  }
              })
              .to_string();

              let source = reader
                  .import_from_store(Some(&store))
                  .expect("a credential is available");

              assert_eq!(
                  source.origin,
                  crate::platform_keychain::Origin::File,
                  "an explicitly named source directory must remain authoritative"
              );
              assert_eq!(source.token.access_token, "file-access");
              assert!(source.document.contains("file-access"));
              assert!(!source.document.contains("keychain-access"));
          }
          '''
          path.write_text(text.replace(marker, test + "\n" + marker, 1))
          PY

          set +e
          cargo test --lib explicit_import_home_does_not_adopt_keychain_credential
          status=$?
          set -e
          test "$status" -ne 0

      - name: Apply the minimal fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/subscription.rs")
          text = path.read_text()
          old = '''    fn import_source_keychain(&self) -> Option<String> {
          crate::platform_keychain::lookup(self.provider)
      }
          '''
          new = '''    fn import_source_keychain(&self) -> Option<String> {
          if !self.is_vendor_default_home() {
              return None;
          }
          crate::platform_keychain::lookup(self.provider)
      }
          '''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify the focused regression test
        run: cargo test --lib explicit_import_home_does_not_adopt_keychain_credential

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Full test suite
        run: cargo test --all-targets

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/issue-285-fix.yml
          git add src/subscription.rs src/subscription_tests.rs .github/workflows/issue-285-fix.yml
          git commit -m "fix: honor explicit auth import source directories"
          git push origin HEAD:fix/auth-import-explicit-source
