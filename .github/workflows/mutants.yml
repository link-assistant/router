# Mutation testing of the security-critical modules (issue #672): token
# verification and reservations, the upstream SSRF guard, authentication and
# credential handling, budget settlement and log redaction. The module list
# lives in .cargo/mutants.toml. A surviving mutant (a change no test notices)
# fails the run; the report is uploaded as an artifact.
#
# Nightly runs every module in four shards. A pull request that touches one
# of the modules mutates only the lines it changed (`--in-diff`), which keeps
# the run to minutes.
name: Mutants

on:
  pull_request:
    paths:
      - 'src/token.rs'
      - 'src/token_validate.rs'
      - 'src/token_constant_time.rs'
      - 'src/token_reservation.rs'
      - 'src/token_secret.rs'
      - 'src/upstream_guard.rs'
      - 'src/auth.rs'
      - 'src/admin_auth.rs'
      - 'src/credential_acceptance.rs'
      - 'src/credential_store.rs'
      - 'src/usage.rs'
      - 'src/storage_budget.rs'
      - 'src/request_log/redaction.rs'
      - '.cargo/mutants.toml'
      - '.github/workflows/mutants.yml'
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      file:
        description: Mutate only this file (empty for every configured module)
        default: ''

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-mutants-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-cargo-

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Run cargo mutants
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ONLY_FILE: ${{ inputs.file }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=(--in-place --shard "$SHARD/4" --no-shuffle)
          if [ "$EVENT" = pull_request ]; then
            git diff "$BASE_SHA"...HEAD > "$RUNNER_TEMP/pr.diff"
            args+=(--in-diff "$RUNNER_TEMP/pr.diff")
          elif [ -n "$ONLY_FILE" ]; then
            args+=(--file "$ONLY_FILE")
          fi
          cargo mutants "${args[@]}"

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore
