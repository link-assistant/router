version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      reviewed-rust-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directories:
      - /js
      - /ts
      - /ui
      - /scripts/ci
    schedule:
      interval: weekly
    groups:
      reviewed-npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories:
      - /rust/fuzz
      - /experiments/issue-725/test-sharder
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /packages/python
    schedule:
      interval: weekly
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /experiments/issue-697/http-clients
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /experiments/issue-697/http-clients
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /experiments/issue-697/http-clients
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker/tunnel
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      reviewed-actions:
        patterns:
          - "*"
