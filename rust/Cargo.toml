[package]
name = "link-assistant-router"
version = "1.25.8"
edition = "2024"
description = "Link.Assistant.Router — Claude MAX OAuth proxy and token gateway for Anthropic APIs"
readme = "../README.md"
license = "Unlicense"
keywords = ["proxy", "anthropic", "claude", "gateway", "oauth"]
categories = ["web-programming::http-server"]
repository = "https://github.com/link-assistant/router"
documentation = "https://docs.rs/link-assistant-router"
rust-version = "1.100.0"
exclude = ["dev/log/**"]

[lib]
name = "link_assistant_router"
path = "src/lib.rs"

# The canonical command is `router`: the name the project, its repository and
# its documentation already use for itself (issue #222). The original name is
# kept as a second binary from the same source so existing scripts, deployments
# and documented commands keep working. That target has its own file, which
# `include!`s `src/main.rs`: Cargo warns on every build when two targets name
# the same file (issue #648).
[[bin]]
name = "router"
path = "src/main.rs"

[[bin]]
name = "link-assistant-router"
path = "src/bin/link-assistant-router.rs"

[[bin]]
name = "with-router"
path = "src/bin/with-router.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
hyper = { version = "1.13.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
reqwest = { version = "0.13.5", features = ["stream", "json", "form", "query", "cookies", "socks"] }
cookie_store = "0.22.1"
url = "2.5.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "fs", "process", "sync", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
jsonschema = { version = "0.63.2", default-features = false }
serde_json = "1.0.154"
toml_edit = "0.25.21"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.3", features = ["v4"] }
getrandom = "0.4.3"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
log-lazy = "0.2.1"
bytes = "1.12.2"
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
http = "1.5.0"
http-body-util = "0.1.5"
lino-arguments = "0.5.0"
lino-objects-codec = "1.1.0"
links-notation = "0.32.0"
doublets = "0.21.0"
link-cli = "3.3.1"
clap = { version = "4.6.10", features = ["derive", "env", "string"] }
base64 = "0.23.1"
async-trait = "0.1.92"
sha2 = "0.11.2"
hex = "0.4.3"
hmac = "0.13.0"
aes-gcm = "0.11.1"
portable-pty = "0.9.0"
os_info = "3.15.0"
rust-embed = { version = "8.14.0", default-features = false }
tempfile = "3.27.0"
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
rcgen = "0.14.10"
flate2 = "1.1.11"
brotli = "9.1.3"
zstd = "0.14.5"
fs2 = "0.4.3"
reflink-copy = "0.1.33"
vt100 = "0.18.1"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "11.0.0", default-features = false, features = ["std", "job-object"] }

[dev-dependencies]
proptest = "1.12.0"
tokio-test = "0.4.6"
tower = { version = "0.5.3", features = ["util"] }
wait-timeout = "0.2.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# Run the importing application as its own process. The integration target
# receives Cargo's absolute path to the built Router CLI.
[[test]]
name = "host_library_consumer"
harness = false

# Hot-path benchmarks (issue #672); the Benchmarks workflow compares a pull
# request against its base with scripts/compare-benchmarks.rs.
[[bench]]
name = "hot_paths"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# These handlers return an axum `Response` as their error, which is the whole
# point: a rejected request answers the caller directly rather than bubbling a
# code the caller would have to translate. `Response` is large, so the lint
# fires on every one of them; boxing it would add an allocation and a deref to
# a path that is already returning by value. Raised to a warning by Rust
# 1.98's clippy, which this branch is the first to run.
result_large_err = "allow"
# Job 132850084718 still reported it inside the `#[path]`-loaded translator
# fixtures although the crate root allowed it (it is a pre-expansion lint). The
# fixtures keep `#[cfg(all())]` on purpose and are pinned byte-for-byte (#772).
non_minimal_cfg = "allow"

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package.metadata.cargo-semver-checks.lints]
enum_variant_added = { level = "allow" }
# Issues #722/#724 extend public defaultable configuration/context structs.
# Keep this lint enabled, requiring a minor release for reviewed field additions.
constructible_struct_adds_field = { required-update = "minor" }
