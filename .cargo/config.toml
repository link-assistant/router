# Local build settings that bound how much disk `target/` can consume.
#
# A debug build of this workspace links many test and binary targets, each
# embedding full debug information. Nothing evicts previous artifacts, so
# ordinary edit-build-test cycles can grow the directory without bound.
#
# CI already sets `CARGO_INCREMENTAL=0`; this matches local builds to it.

[build]
# The incremental cache is the single largest contributor. Turning it off costs
# some rebuild time on small edits and removes the directory that grows without
# bound.
incremental = false

[profile.dev]
# Line tables rather than full DWARF. Backtraces and panic locations still
# resolve; what is lost is stepping through variables in a debugger, which is
# a trade worth making across the many linked binaries.
debug = 1
