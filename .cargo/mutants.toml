# cargo-mutants configuration (issue #672). The `Mutants` workflow mutates the
# security-critical modules below and fails when a mutant survives the test
# suite: a change to token verification, the SSRF guard, credential handling,
# budget settlement or log redaction that no test notices.
#
#   cargo install cargo-mutants --locked
#   cargo mutants --in-place --file rust/src/token_validate.rs   # one module
#   cargo mutants                                          # every module below

examine_globs = [
    "rust/src/token.rs",
    "rust/src/token_validate.rs",
    "rust/src/token_constant_time.rs",
    "rust/src/token_reservation.rs",
    "rust/src/token_secret.rs",
    "rust/src/upstream_guard.rs",
    "rust/src/auth.rs",
    "rust/src/admin_auth.rs",
    "rust/src/credential_acceptance.rs",
    "rust/src/credential_store.rs",
    "rust/src/usage.rs",
    "rust/src/storage_budget.rs",
    "rust/src/request_log/redaction.rs",
]

# Logging and Debug formatting are not security behaviour.
#
# cargo-mutants recognises `Option` only by name, so for a function returning
# the `crate::translation_core::Maybe<T>` alias it generates `Maybe::new(..)`,
# `Maybe::from(..)` and `Maybe::from_iter(..)` replacements. `Maybe` is not in
# scope in these modules (and `Option` has no `new`), so every one of them
# fails to build: all 1,719 tested in the 2026-11-14 runs were unviable, about
# 28 seconds each, and they were two thirds of the 1,590 mutants. Mutations
# inside those functions are still generated.
exclude_re = [
    "impl Debug",
    "impl (std::fmt::)?Display",
    "tracing::",
    " with Maybe::(new|from|from_iter)\\(",
]

# Build with `[profile.mutants]` from the workspace `Cargo.toml` (no debug
# symbols), which makes each mutant's incremental build faster.
profile = "mutants"

# Whole-suite builds are slow; give each mutant's test run generous headroom
# over the unmutated baseline before calling it a timeout.
timeout_multiplier = 3.0
