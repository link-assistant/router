repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(?:dev/log/|docs/case-studies/|experiments/|ui/dist/)
      - id: end-of-file-fixer
        exclude: ^(?:CHANGELOG\.md$|dev/log/|docs/case-studies/|experiments/|ui/dist/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
