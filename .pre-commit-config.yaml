repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(?:dev/log/|docs/case-studies/|experiments/|ui/dist/)
      - id: end-of-file-fixer
        exclude: ^(?:CHANGELOG\.md$|dev/log/|docs/case-studies/|experiments/|ui/dist/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false

      # Drop build artifacts the commit's own build did not use.
      #
      # `target/` keeps superseded test and binary artifacts, re-linked on each
      # change and never evicted, so it can grow without bound. This prunes what
      # the build just finished with, so a fresh build's output survives and
      # everything it superseded goes.
      #
      # `post-commit`, not `pre-commit`: `--stamp` must precede the build for
      # `--file` to spare it, and the hooks above build. Running here means the
      # stamp written last time bounds the artifacts written this time.
      #
      # Never fails a commit: `cargo-sweep` is optional tooling, and a missing
      # binary or a locked target directory is not a reason to reject work.
      - id: cargo-sweep
        name: cargo sweep (drop superseded build artifacts)
        entry: scripts/sweep-build-artifacts.sh
        language: system
        types: [rust]
        pass_filenames: false
        stages: [post-commit]
        always_run: true
