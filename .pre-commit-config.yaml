repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(?:dev/log/|docs/case-studies/|experiments/|ui/dist/)
      - id: end-of-file-fixer
        exclude: ^(?:CHANGELOG\.md$|dev/log/|docs/case-studies/|experiments/|ui/dist/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false

      # Always reclaim the build output produced by the checks above. Keeping
      # this as the last pre-commit hook bounds disk use even in worktrees and
      # does not require optional contributor tooling.
      - id: cargo-clean
        name: cargo clean (clear build cache)
        entry: scripts/sweep-build-artifacts.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true
