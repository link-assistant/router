[workspace]
members = ["rust"]
default-members = ["rust"]
exclude = ["rust/fuzz"]
resolver = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
lto = false
codegen-units = 16
strip = false

# cargo-mutants builds every mutant with this profile (`.cargo/mutants.toml`).
# Each mutant relinks every test binary, and without debug symbols that is
# faster; a failing test under a mutant needs no debugger.
[profile.mutants]
inherits = "test"
debug = "none"
