[package]
name = "link-assistant-router"
version = "0.98.0"
edition = "2024"
description = "Link.Assistant.Router — Claude MAX OAuth proxy and token gateway for Anthropic APIs"
readme = "README.md"
license = "Unlicense"
keywords = ["proxy", "anthropic", "claude", "gateway", "oauth"]
categories = ["web-programming::http-server"]
repository = "https://github.com/link-assistant/router"
documentation = "https://github.com/link-assistant/router"
rust-version = "1.88"
exclude = ["dev/log/**"]

[lib]
name = "link_assistant_router"
path = "src/lib.rs"

# The canonical command is `router`: the name the project, its repository and
# its documentation already use for itself (issue #222). The original name is
# kept as a second binary from the same source so existing scripts, deployments
# and documented commands keep working.
[[bin]]
name = "router"
path = "src/main.rs"

[[bin]]
name = "link-assistant-router"
path = "src/main.rs"

[[bin]]
name = "with-router"
path = "src/bin/with-router.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", features = ["stream", "json", "form", "query"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal", "fs", "process", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.25"
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.24", features = ["v4"] }
getrandom = "0.4"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log-lazy = "0.2"
bytes = "1.12"
futures-util = "0.3"
http = "1.5"
http-body-util = "0.1"
lino-arguments = "0.3"
lino-objects-codec = "0.3.0"
links-notation = "0.13.0"
doublets = "0.4.0"
mem = { package = "platform-mem", version = "0.3.0" }
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.23"
async-trait = "0.1"
sha2 = "0.11"
hex = "0.4"
aes-gcm = "0.11"
portable-pty = "0.9"
rust-embed = { version = "8.12.0", default-features = false }
fs2 = "0.4"
tempfile = "3"

[dev-dependencies]
proptest = "1"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
wait-timeout = "0.2"

[lints.rust]
# The file-mapping compatibility adapter has a scoped exception; unsafe code
# remains denied throughout the rest of the crate.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
