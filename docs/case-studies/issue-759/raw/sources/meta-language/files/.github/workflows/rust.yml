name: Rust

# .github/workflows/ci.yml calls this workflow on pushes to main and on pull
# requests after the JavaScript workflow passes, so a JavaScript failure shows
# every Rust job as skipped. A manual dispatch runs it standalone for releases.
# The dispatch inputs are absent when called; the jobs that read them run only
# on workflow_dispatch.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changelog-pr
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

# Least-privilege default for every job; jobs that need more escalate explicitly.
permissions:
  contents: read

# A newer push to a pull request cancels the run of its older head. Push,
# release and dispatch runs are grouped by their own run id, so they never
# cancel each other; their write jobs queue in the release write group. The
# group has its own literal prefix: called from ci.yml, github.workflow names
# the caller, and a group equal to the caller's would deadlock with it.
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  # Support both CARGO_REGISTRY_TOKEN (cargo's native env var) and CARGO_TOKEN (for backwards compatibility)
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
  CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
  # Optional: set repository variable DOCKERHUB_IMAGE to namespace/image to publish Docker Hub releases.
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

jobs:
  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: rust-${{ github.ref }}-detect-changes
      cancel-in-progress: true
    if: github.event_name != 'workflow_dispatch'
    outputs:
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: ./rust/scripts/install-rust-script.sh

      # Run from the repository root so the script's `git diff` output (which is
      # always repository-root relative) matches the multi-language path prefixes.
      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: rust-script rust/scripts/detect-code-changes.rs

  # === CHANGELOG CHECK - only runs on PRs with code changes ===
  # Docs-only PRs (./docs folder, markdown files) don't require changelog fragments
  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: rust-${{ github.ref }}-changelog
      cancel-in-progress: true
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: ./rust/scripts/install-rust-script.sh

      # Run from the repository root so `git diff` paths match `rust/changelog.d/`.
      - name: Check for changelog fragments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script rust/scripts/check-changelog-fragment.rs

  # === VERSION CHECK - prevents manual version modification in PRs ===
  # This ensures versions are only modified by the automated release pipeline
  version-check:
    name: Version Modification Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: rust-${{ github.ref }}-version-check
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: ./rust/scripts/install-rust-script.sh

      # Run from the repository root so `git diff` paths match `rust/Cargo.toml`.
      - name: Check for manual version changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script rust/scripts/check-version-modification.rs

  # === SECRETS SCAN ===
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: rust-${{ github.ref }}-secrets-scan
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Run secretlint
        run: npx --yes -p secretlint -p @secretlint/secretlint-rule-preset-recommend secretlint --secretlintignore .gitignore "**/*"

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # === FRESH MERGE SIMULATION ===
  fresh-merge:
    name: Fresh Merge Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: rust-${{ github.ref }}-fresh-merge
      cancel-in-progress: true
    needs: [detect-changes, check]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true' && needs.check.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js for shared JavaScript reports
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-fresh-merge-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fresh-merge-

      - name: Simulate fresh merge with base branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash rust/scripts/simulate-fresh-merge.sh

  # === CARGO.LOCK GUARD ===
  cargo-lock:
    name: Cargo.lock Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: rust-${{ github.ref }}-cargo-lock
      cancel-in-progress: true
    needs: [detect-changes]
    defaults:
      run:
        working-directory: rust
    if: |
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true' ||
        needs.detect-changes.outputs.any-code-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Check committed Cargo.lock for binary crates
        working-directory: ${{ github.workspace }}
        run: rust-script rust/scripts/check-cargo-lock.rs

  # === CARGO CHECK GATE ===
  # Type-checks the library, binaries, tests, examples and benches once. The
  # suites, MSRV, coverage and the fresh merge wait for it, so a compile error
  # fails here in a few minutes instead of in every test job.
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rust-${{ github.ref }}-check
      cancel-in-progress: true
    needs: [detect-changes, cargo-lock]
    defaults:
      run:
        working-directory: rust
    if: |
      !cancelled() && needs.cargo-lock.result == 'success' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check every target with every feature
        run: node ../scripts/with-cache-cleanup.mjs --event build -- cargo check --locked --all-targets --all-features

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # === MINIMUM SUPPORTED RUST VERSION ===
  # Builds the library, binaries and tests with the toolchain Cargo.toml declares
  # as `rust-version`, so the declared minimum stays true as dependencies update.
  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rust-${{ github.ref }}-msrv
      cancel-in-progress: true
    needs: [detect-changes, cargo-lock, check]
    defaults:
      run:
        working-directory: rust
    if: |
      !cancelled() && needs.cargo-lock.result != 'failure' && needs.check.result == 'success' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Read the declared rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Check with the minimum supported Rust version
        run: cargo check --locked --all-features --all-targets

      - name: Clean caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # === LINT AND FORMAT CHECK ===
  # Lint runs independently of changelog check - it's a fast check that should always run
  # See: https://github.com/link-assistant/hive-mind/pull/1024 for why this dependency was removed
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: rust-${{ github.ref }}-lint
      cancel-in-progress: true
    needs: [detect-changes, cargo-lock]
    defaults:
      run:
        working-directory: rust
    # !cancelled() lets workflow_dispatch evaluate skipped detect-changes while
    # still propagating user cancellation immediately.
    # See: https://github.com/actions/runner/issues/491
    if: |
      !cancelled() && needs.cargo-lock.result == 'success' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true' ||
        needs.detect-changes.outputs.any-code-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Reject tests in src
        if: ${{ !cancelled() }}
        run: rust-script scripts/check-no-src-tests.rs

      - name: Run Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features

      # docs.rs honors package.metadata.docs.rs and builds this feature set.
      # Keep it free of optional native/build-script dependencies.
      - name: Check docs.rs feature set
        if: ${{ !cancelled() }}
        env:
          DOCS_RS: 1
        run: cargo check --no-default-features

      - name: Collect changed files
        if: ${{ !cancelled() }}
        id: changed-files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          {
            echo 'files<<CHANGED_FILES_EOF'
            if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git diff --name-only "$BASE_SHA" HEAD | sed -n 's#^rust/##p'
            else
              git ls-files | sed -n 's#^rust/##p'
            fi
            echo 'CHANGED_FILES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build documentation with warnings denied
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Check file size limit
        if: ${{ !cancelled() }}
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: rust-script scripts/check-file-size.rs

      # Enforce the Rust <-> JavaScript feature parity manifest. The Rust pipeline
      # fails if a feature is not mirrored in both languages (see ../parity).
      - name: Check Rust/JavaScript parity manifest
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node js/scripts/check-js-rust-parity.mjs --manifest-only

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # === TEST ===
  # The suites partition the tests by name: each later suite skips the
  # filters of the earlier ones, and `remaining` skips all of them, so every
  # test runs in exactly one suite. Doc tests and the example check run with
  # `remaining`. The generative suite runs alone: native Lean's malformed
  # inputs repair over many rounds, and with the translation tests they
  # outran the job's timeout on Windows. Each language's fixture cases and
  # run-time cases are two tests, so the two run side by side.
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    # Cold Windows grammar builds exhausted the 15-minute job deadline while
    # tests were still running. Preserve every test and bound this job at 30.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.suite == 'grammar' && 30 || 15 }}
    concurrency:
      group: rust-${{ github.ref }}-test-${{ matrix.os }}-${{ matrix.suite }}
      cancel-in-progress: true
    needs: [detect-changes, changelog, cargo-lock, check]
    defaults:
      run:
        working-directory: rust
    if: |
      !cancelled() &&
      needs.cargo-lock.result == 'success' &&
      needs.check.result == 'success' &&
      (needs.changelog.result == 'success' || needs.changelog.result == 'skipped') && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        suite: [grammar, inference, generative, translation, remaining]
        include:
          - suite: grammar
            filters: grammar_
          - suite: inference
            filters: inference_ --skip grammar_
          - suite: generative
            filters: issue_195_generative --skip grammar_ --skip inference_
          - suite: translation
            filters: translation_ issue_195_ conformance --skip grammar_ --skip inference_ --skip issue_195_generative
          - suite: remaining
            filters: --skip grammar_ --skip inference_ --skip issue_195_generative --skip translation_ --skip issue_195_ --skip conformance
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js for translated JavaScript tests
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install shared JavaScript test dependencies
        working-directory: js
        run: npm ci --ignore-scripts

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) {
            throw "Visual Studio with C++ tools not found"
          }

          $vcvars = Join-Path $installationPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }

          $vcvarsEnvironment = @{}
          $existingPath = $env:Path -split ";" | Where-Object { $_ }
          cmd /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              $vcvarsEnvironment[$name] = $value
              if ($name -eq "Path") {
                # GITHUB_PATH prepends to the existing PATH; a Path entry in GITHUB_ENV would add a
                # second, differently cased variable that child processes may resolve instead.
                # Only the directories vcvars added are prepended: re-prepending the runner's own
                # entries would put WindowsApps (whose bash.exe is the WSL launcher) ahead of Git Bash.
                $value -split ";" | Where-Object { $_ -and ($existingPath -notcontains $_) } | ForEach-Object {
                  $_ | Out-File -FilePath $env:GITHUB_PATH -Append
                }
              } elseif ($name -match "^(INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion)$") {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append
              }
            }
          }

          $vctoolsInstallDir = $vcvarsEnvironment["VCToolsInstallDir"]
          if (-not $vctoolsInstallDir) {
            throw "VCToolsInstallDir was not set by vcvars64.bat"
          }

          $msvcLinker = Join-Path $vctoolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $msvcLinker)) {
            throw "MSVC link.exe not found at $msvcLinker"
          }

          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLinker" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure AWS-LC CMake on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "AWS_LC_SYS_C_STD=11" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache cargo registry on Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-registry-

      - name: Cache cargo registry and target on Unix
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # Tests and doc tests run through the cleanup wrapper; examples are
      # only checked, not linked, so the target stays small.
      - name: Run tests
        shell: bash
        env:
          SUITE_FILTERS: ${{ matrix.filters }}
        # The filters are word-split on purpose: they are separate arguments.
        run: node ../scripts/with-cache-cleanup.mjs --event test -- cargo test --no-fail-fast --all-features --tests --verbose -- $SUITE_FILTERS

      - name: Run doc tests
        if: ${{ !cancelled() && matrix.suite == 'remaining' }}
        shell: bash
        # Both feature sets run even when the first fails; the step fails if either did.
        run: |
          status=0
          node ../scripts/with-cache-cleanup.mjs --event test -- cargo test --no-fail-fast --all-features --doc --verbose || status=1
          node ../scripts/with-cache-cleanup.mjs --event test -- cargo test --no-fail-fast --doc --verbose || status=1
          exit "$status"

      - name: Check examples
        if: ${{ !cancelled() && matrix.suite == 'remaining' }}
        shell: bash
        run: cargo check --examples --all-features

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # === CODE COVERAGE ===
  # Generate code coverage with cargo-llvm-cov in the suites of the test job,
  # so that each shard runs a part of the tests under instrumentation within
  # its timeout, then merge the shards' reports, enforce the line coverage
  # floor on the merged report and upload it to Codecov.
  coverage:
    name: Code Coverage (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rust-${{ github.ref }}-coverage-${{ matrix.suite }}
      cancel-in-progress: true
    needs: [detect-changes, cargo-lock, check]
    defaults:
      run:
        working-directory: rust
    if: |
      !cancelled() && needs.cargo-lock.result == 'success' && needs.check.result == 'success' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        suite: [grammar, inference, generative, translation, remaining]
        include:
          - suite: grammar
            filters: grammar_
          - suite: inference
            filters: inference_ --skip grammar_
          - suite: generative
            filters: issue_195_generative --skip grammar_ --skip inference_
          - suite: translation
            filters: translation_ issue_195_ conformance --skip grammar_ --skip inference_ --skip issue_195_generative
          - suite: remaining
            filters: --skip grammar_ --skip inference_ --skip issue_195_generative --skip translation_ --skip issue_195_ --skip conformance
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Node.js for shared JavaScript reports
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install shared JavaScript test dependencies
        working-directory: js
        run: npm ci --ignore-scripts

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # The filters are word-split on purpose: they are separate arguments.
      - name: Generate code coverage
        shell: bash
        env:
          SUITE_FILTERS: ${{ matrix.filters }}
        run: node ../scripts/with-cache-cleanup.mjs --event coverage --protect lcov.info -- cargo llvm-cov --all-features --lcov --output-path lcov.info --no-fail-fast -- $SUITE_FILTERS

      - name: Upload the shard's coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.suite }}
          path: rust/lcov.info
          retention-days: 1

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  coverage-report:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: rust-${{ github.ref }}-coverage-report
      cancel-in-progress: true
    needs: [coverage]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    if: ${{ !cancelled() && needs.coverage.result == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the shards' coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-shards

      - name: Merge coverage and enforce the line coverage floor
        run: node scripts/merge-lcov.mjs --output rust/lcov.info --fail-under-lines 84.30 coverage-shards/*/lcov.info

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: rust/lcov.info
          disable_search: true
          fail_ci_if_error: true

      - name: Report skipped Codecov upload
        if: env.CODECOV_TOKEN == ''
        run: echo "::notice::Skipping Codecov upload because CODECOV_TOKEN is not configured"

  # === BUILD ===
  # Build package - only runs if lint and test pass
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: rust-${{ github.ref }}-build
      cancel-in-progress: true
    needs: [lint, test]
    defaults:
      run:
        working-directory: rust
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        run: node ../scripts/with-cache-cleanup.mjs --event build -- cargo build --release --verbose

      - name: Check package
        if: ${{ !cancelled() }}
        run: node ../scripts/with-cache-cleanup.mjs --event package -- cargo package --list --allow-dirty

      - name: Check crate package size
        if: ${{ !cancelled() }}
        run: rust-script scripts/check-crate-size.rs

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # === AUTO RELEASE ===
  # Automatic release on push to main using changelog fragments
  # This job automatically bumps version based on fragments in changelog.d/
  auto-release:
    name: Auto Release
    needs: [lint, test, build]
    concurrency:
      group: release-${{ github.repository }}-main-write
      cancel-in-progress: false
    defaults:
      run:
        working-directory: rust
    # Never cancel or overlap writes to main and external registries.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Configure git
        run: rust-script scripts/git-config.rs

      - name: Determine bump type from changelog fragments
        id: bump_type
        run: rust-script scripts/get-bump-type.rs

      - name: Check if version already released or no fragments
        id: check
        env:
          HAS_FRAGMENTS: ${{ steps.bump_type.outputs.has_fragments }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-release-needed.rs

      - name: Collect changelog and bump version
        id: version
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.skip_bump != 'true'
        run: |
          rust-script scripts/version-and-commit.rs \
            --bump-type "${{ steps.bump_type.outputs.bump_type }}"

      - name: Get current version
        id: current_version
        if: steps.check.outputs.should_release == 'true'
        run: rust-script scripts/get-version.rs

      - name: Build release
        if: steps.check.outputs.should_release == 'true'
        run: node ../scripts/with-cache-cleanup.mjs --event build -- cargo build --release

      - name: Check crate package size
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.crate_published != 'true'
        run: rust-script scripts/check-crate-size.rs

      - name: Publish to Crates.io
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.crate_published != 'true'
        id: publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: rust-script scripts/publish-crate.rs

      - name: Wait for Crate availability on Crates.io
        if: |
          steps.check.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        run: rust-script scripts/wait-for-crate.rs --release-version "${{ steps.current_version.outputs.version }}"

      - name: Configure Docker Hub publishing
        if: |
          steps.check.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        id: dockerhub
        working-directory: ${{ github.workspace }}
        run: |
          disable_dockerhub() {
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "$1"
          }

          if [ -z "$DOCKERHUB_IMAGE" ]; then
            disable_dockerhub "Docker Hub publishing disabled: DOCKERHUB_IMAGE repository variable is not set"
            exit 0
          fi

          if [ ! -f Dockerfile ]; then
            disable_dockerhub "Docker Hub publishing disabled: Dockerfile was not found at repository root"
            exit 0
          fi

          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Docker Hub publishing requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"
            echo "Set DOCKERHUB_USERNAME as a repository variable or secret, and DOCKERHUB_TOKEN as a secret."
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "docker_hub_url=https://hub.docker.com/r/${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        if: steps.dockerhub.outputs.enabled == 'true'
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.current_version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.current_version.outputs.version }}

      - name: Publish Docker image to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: Create GitHub Release
        if: |
          steps.check.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_HUB_URL: ${{ steps.dockerhub.outputs.docker_hub_url }}
        run: |
          # Use new_version from version-and-commit when available (tag-checked), else fall back to Cargo.toml version
          RELEASE_VERSION="${{ steps.version.outputs.new_version }}"
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="${{ steps.current_version.outputs.version }}"
          fi

          release_args=(
            --release-version "$RELEASE_VERSION"
            --repository "${{ github.repository }}"
          )
          if [ -n "$DOCKER_HUB_URL" ]; then
            release_args+=(--docker-hub-url "$DOCKER_HUB_URL")
          fi
          rust-script scripts/create-github-release.rs "${release_args[@]}"

      # A release created with GITHUB_TOKEN does not emit a new release workflow
      # run. Dispatch the one canonical package publisher explicitly so its trusted-
      # publishing identity remains .github/workflows/js.yml. The dispatch runs on
      # the release tag, so npm receives the merged commit the crate came from even
      # when main has moved on.
      - name: Dispatch JavaScript publisher
        if: |
          steps.check.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.current_version.outputs.version }}
        run: gh workflow run js.yml --ref "v$RELEASE_VERSION" -f release_version="$RELEASE_VERSION"

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # === MANUAL INSTANT RELEASE ===
  # Manual release via workflow_dispatch - only after CI passes
  manual-release:
    name: Instant Release
    needs: [lint, test, build]
    concurrency:
      group: release-${{ github.repository }}-main-write
      cancel-in-progress: false
    defaults:
      run:
        working-directory: rust
    # The build job ensures lint and test passed before this job runs.
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.release_mode == 'instant' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Configure git
        run: rust-script scripts/git-config.rs

      - name: Collect changelog fragments
        run: rust-script scripts/collect-changelog.rs

      - name: Version and commit
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: rust-script scripts/version-and-commit.rs --bump-type "$BUMP_TYPE" --description "$DESCRIPTION"

      - name: Build release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        run: node ../scripts/with-cache-cleanup.mjs --event build -- cargo build --release

      - name: Check crate package size
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        run: rust-script scripts/check-crate-size.rs

      - name: Publish to Crates.io
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: rust-script scripts/publish-crate.rs

      - name: Wait for Crate availability on Crates.io
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        run: rust-script scripts/wait-for-crate.rs --release-version "${{ steps.version.outputs.new_version }}"

      - name: Configure Docker Hub publishing
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        id: dockerhub
        working-directory: ${{ github.workspace }}
        run: |
          disable_dockerhub() {
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "$1"
          }

          if [ -z "$DOCKERHUB_IMAGE" ]; then
            disable_dockerhub "Docker Hub publishing disabled: DOCKERHUB_IMAGE repository variable is not set"
            exit 0
          fi

          if [ ! -f Dockerfile ]; then
            disable_dockerhub "Docker Hub publishing disabled: Dockerfile was not found at repository root"
            exit 0
          fi

          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Docker Hub publishing requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"
            echo "Set DOCKERHUB_USERNAME as a repository variable or secret, and DOCKERHUB_TOKEN as a secret."
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "docker_hub_url=https://hub.docker.com/r/${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        if: steps.dockerhub.outputs.enabled == 'true'
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.new_version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.new_version }}

      - name: Publish Docker image to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: Create GitHub Release
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_HUB_URL: ${{ steps.dockerhub.outputs.docker_hub_url }}
        run: |
          release_args=(
            --release-version "${{ steps.version.outputs.new_version }}"
            --repository "${{ github.repository }}"
          )
          if [ -n "$DOCKER_HUB_URL" ]; then
            release_args+=(--docker-hub-url "$DOCKER_HUB_URL")
          fi
          rust-script scripts/create-github-release.rs "${release_args[@]}"

      - name: Dispatch JavaScript publisher
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: gh workflow run js.yml --ref "v$RELEASE_VERSION" -f release_version="$RELEASE_VERSION"

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # === MANUAL CHANGELOG PR ===
  changelog-pr:
    name: Create Changelog PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changelog-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.repository }}-main-write
      cancel-in-progress: false
    defaults:
      run:
        working-directory: rust
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Create changelog fragment
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: rust-script scripts/create-changelog-fragment.rs --bump-type "$BUMP_TYPE" --description "$DESCRIPTION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changelog for manual ${{ github.event.inputs.bump_type }} release'
          branch: changelog-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changelog fragment in this PR
            2. Merge this PR to main
            3. The automated release workflow will publish to crates.io and create a GitHub release

  # === DEPLOY WEBSITE ===
  # Deploy the project website to GitHub Pages after a successful package build.
  # The website is assembled by rust/scripts/build-site.rs into the `_site/` tree.
  #   /          -> landing page (description + interactive demo + docs links)
  #   /demo/pkg/ -> WebAssembly demo built from the rust/web/ crate
  #   /api/      -> rustdoc, with a root redirect index.html
  #
  # Deploying the assembled `_site/` (instead of raw `target/doc`) fixes issue
  # #90: `cargo doc` writes `target/doc/<crate>/index.html` but never a root
  # `target/doc/index.html`, so deploying `target/doc` directly made the Pages
  # root URL return HTTP 404. The landing page now lives at the root.
  #
  # Keep this independent from package/GitHub release publication so the website
  # still updates when the release path fails. Use the official Pages artifact
  # deployment path so repositories configured with "GitHub Actions" as their
  # Pages source fail this job if Pages cannot deploy.
  #
  # One-time setup: in the repository's Settings -> Pages, set Source to
  # "GitHub Actions". Without this, the first run fails on actions/deploy-pages
  # with "Get Pages site failed" / "Failed to create deployment". This cannot be
  # configured from a workflow. See README.md "Deploying the website".
  deploy-docs:
    name: Deploy Website
    needs: [build]
    if: |
      !cancelled() &&
      needs.build.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.repository }}-main-write
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install rust-script
        run: ./rust/scripts/install-rust-script.sh

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build documentation
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Build WebAssembly demo
        working-directory: rust/web
        run: node ../../scripts/with-cache-cleanup.mjs --event build --protect pkg -- wasm-pack build --release --target web --out-dir pkg

      - name: Assemble website
        working-directory: rust
        run: rust-script scripts/build-site.rs --assemble-only

      - name: List built site
        run: find _site -maxdepth 2 -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown
