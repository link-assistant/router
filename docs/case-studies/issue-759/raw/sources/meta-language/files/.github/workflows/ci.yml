  acceptance:
    name: Full Requirements Aggregate
    needs: [js, candidates, consumers, rml-workloads, formal-ai-workloads, runtime-parity, native-javascript, native-rust, native-translations, javascript-suite, rust-suite, delivery]
    # GitHub reports a skipped job as a successful required check. This job
    # always runs and fails itself when there are no candidates to evaluate.
    if: ${{ always() }}
    # actions: read lists the failed JavaScript jobs for the gate error.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-acceptance-${{ github.ref }}
      cancel-in-progress: true
    # When a JavaScript job failed, no acceptance stage ran: the first step
    # reports that as one gate error naming the failed JavaScript jobs, not one
    # per stage or requirement.
    steps:
      - name: Require delivery candidates
        if: ${{ needs.candidates.result != 'success' }}
        env:
          CANDIDATES_RESULT: ${{ needs.candidates.result }}
          JAVASCRIPT_RESULT: ${{ needs.js.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$JAVASCRIPT_RESULT" = failure ] || [ "$JAVASCRIPT_RESULT" = cancelled ]; then
            failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
              --jq '.jobs[] | select(.name | startswith("JavaScript / ")) | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .name' 2>/dev/null | paste -sd ',' - | sed 's/,/, /g')
            echo "::error::${failed:-The JavaScript workflow} finished as '${JAVASCRIPT_RESULT}'; the acceptance stages run only after every JavaScript job passes, so none of them ran"
          else
            echo "::error::Delivery Candidates finished as '${CANDIDATES_RESULT}'; the Full Requirements Aggregate cannot pass without them"
          fi
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Validate atomic manifest and protected scope baseline
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.release.target_commitish }}
          ISSUE_195_SCOPE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'issue-195-scope-change-approved') }}
        run: node js/scripts/check-issue-195-acceptance.mjs --scope-baseline "$BASELINE_SHA"

      # A stage whose job failed before uploading has no record here; the
      # aggregate reports it as one gate error naming the stage.
      - name: Download the evidence stage outputs
        if: ${{ !cancelled() && needs.candidates.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: issue-195-stage-*-${{ github.sha }}
          path: issue-195-results
          merge-multiple: true

      - name: Merge the evidence stages
        if: ${{ !cancelled() && needs.candidates.result == 'success' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --aggregate

      - name: Evaluate every required verification cell
        if: ${{ always() && needs.candidates.result == 'success' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
        run: >-
          node js/scripts/check-issue-195-acceptance.mjs
          --produce-gate-results issue-195-results/gate-faults.json
          --evaluate
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --results-dir issue-195-results
          --json-report issue-195-artifacts/report.json
          --markdown-report issue-195-artifacts/report.md

      - name: Publish per-requirement evidence report
        if: ${{ always() && needs.candidates.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-requirement-report-${{ github.sha }}
          path: |
            issue-195-artifacts/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
            issue-195-results/work/native/
          if-no-files-found: error
