  # default-branch rules exist outside any pull request, so no pull request
  # check depends on them, and a failure here is fixed in a follow-up commit.
  post-merge:
    name: Post-merge Report
    needs: js
    if: ${{ github.event_name == 'push' && needs.js.result == 'success' }}
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      checks: read
