[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "link-assistant-router"
version = "1.18.1"
description = "Official typed Router operations and testing helpers"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5"]
license = "Unlicense"

[project.urls]
Repository = "https://github.com/link-assistant/router"
Documentation = "https://github.com/link-assistant/router/blob/main/docs/integration/downstream.md"

[tool.setuptools.package-data]
link_assistant_router = ["catalog.json", "schemas/*.json", "py.typed", "*.pyi"]
