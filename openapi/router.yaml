      },
      "AdminStatus": {
        "additionalProperties": false,
        "description": "Public view of the admin credential state, used by\n`GET /api/management/admin/status`.\n\nThe flags are independent facts about the same credential, so they are\nreported as flags rather than collapsed into an enum the client would have\nto re-expand.",
        "properties": {
          "bootstrap_open": {
            "description": "Whether a fresh bootstrap may be started right now.",
            "type": "boolean"
          },
          "candidate_pending": {
            "description": "Whether an unconfirmed candidate is currently outstanding.",
            "type": "boolean"
          },
          "claimed": {
            "description": "Whether an admin credential exists (claimed or provisioned).",
            "type": "boolean"
          },
          "claimed_at": {
            "description": "Unix seconds at which the claim was confirmed, when it was.",
            "format": "uint64",
            "minimum": 0,
            "type": [
              "integer",
              "null"
            ]
          },
          "credential_kind": {
            "$ref": "#/components/schemas/AdminStatus_CredentialKind",
            "description": "Which credential model the active credential uses."
          },
          "provisioned_by_environment": {
            "description": "Whether the credential came from the environment rather than a claim.",
            "type": "boolean"
          },
          "token_id": {
            "description": "`sub` of the active admin JWT, when the credential is one. The token\nid is metadata, not a secret \u2014 it is what `tokens revoke`/`rotate` take.",
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "claimed",
          "bootstrap_open",
          "provisioned_by_environment",
          "candidate_pending",
          "credential_kind"
        ],
        "title": "AdminStatus",
        "type": "object"
      },
      "AdminStatus_CredentialKind": {
        "description": "Which credential model the active admin credential uses.",
        "oneOf": [
          {
            "const": "none",
            "description": "Nothing is claimed and no key was provisioned.",
            "type": "string"
          },
          {
            "const": "environment",
            "description": "A flat `TOKEN_ADMIN_KEY` provisioned at deploy time.",
            "type": "string"
          },
          {
            "const": "jwt",
            "description": "An admin-scoped `la_sk_\u2026` JWT minted by the token manager.",
            "type": "string"
          },
          {
            "const": "legacy_opaque",
            "description": "A pre-JWT opaque `la_admin_\u2026` value; rotate it into a JWT.",
            "type": "string"
          }
        ]
      },
